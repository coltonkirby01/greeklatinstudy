name: Preserve Henle session history
on:
  push:
    branches: [chatgpt/rolling-auto-grade]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rolling-auto-grade
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/study/session-management.ts')
          s=p.read_text()
          s=s.replace('  Latin: ["dickinson-latin-core", "latin-active-indicative-paradigms", "latin-passive-indicative-paradigms"],','  Latin: ["dickinson-latin-core", "henle-part1-forms", "latin-active-indicative-paradigms", "latin-passive-indicative-paradigms"],',1)
          s=s.replace('  if (deckId === "dickinson-latin-core") return "Dickinson Vocabulary";\n  if (deckId === "latin-active-indicative-paradigms") return "Active Indicative Paradigms";','  if (deckId === "dickinson-latin-core") return "Dickinson Vocabulary";\n  if (deckId === "henle-part1-forms") return studyKey.startsWith("chart") ? "Henle Whole Charts" : "Henle Grammar Forms";\n  if (deckId === "latin-active-indicative-paradigms") return "Active Indicative Paradigms";',1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/study/session-management.ts
          git diff --cached --check
          git commit -m "Preserve legacy Henle session history"
          git push origin HEAD:chatgpt/rolling-auto-grade
