name: Apply timer direction stats guide updates v4

on:
  push:
    branches:
      - feature/timer-direction-stats-guide

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timer-direction-stats-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reapply requested patch and fix legacy Greek compile
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-timer-direction-stats-guide-v3.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'apply-v3.py', 'exec'), {})

          legacy = Path('src/pages/greek-page.tsx')
          text = legacy.read_text()
          old = '      onDirectionChange={setDirection}\n      directionLabels={{ forward: "Forward", reverse: "Reverse" }}\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy Greek direction prop block, found {text.count(old)}')
          legacy.write_text(text.replace(old, '', 1))

          current = Path('.github/workflows/apply-timer-direction-stats-guide-v4.yml')
          if current.exists(): current.unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify maintenance, tests, and Pages build
        run: npm run check
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine timer, direction controls, session scoring, and guide"
          git push origin HEAD:feature/timer-direction-stats-guide
