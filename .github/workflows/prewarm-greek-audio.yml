name: Prewarm shared Greek audio

on:
  workflow_dispatch:
    inputs:
      asset_ids:
        description: Space-separated built-in Greek audio asset IDs to generate/cache
        required: true
        type: string

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Generate and cache requested built-in Greek audio assets
        env:
          SUPABASE_URL: https://wqgvpgmudouftyhnvvpr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_s4DGueytgij3zvSce1D1hQ_jtEf1X1e
          ASSET_IDS: ${{ inputs.asset_ids }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a ids <<< "$ASSET_IDS"
          if [[ "${#ids[@]}" -eq 0 ]]; then
            echo "No Greek audio asset IDs were supplied." >&2
            exit 1
          fi

          echo "Prewarming ${#ids[@]} requested Greek audio assets"
          for id in "${ids[@]}"; do
            success=0
            for attempt in 1 2 3 4 5; do
              status=$(curl --silent --show-error --output /tmp/course-audio-response.json --write-out '%{http_code}' \
                --request POST "$SUPABASE_URL/functions/v1/course-audio" \
                --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                --header 'Content-Type: application/json' \
                --data "{\"assetId\":\"$id\"}")
              if [[ "$status" == "200" ]]; then
                echo "$id: ready"
                success=1
                break
              fi
              echo "$id: attempt $attempt failed with HTTP $status"
              cat /tmp/course-audio-response.json
              echo
              sleep $((attempt * 2))
            done
            if [[ "$success" != "1" ]]; then
              echo "Failed to prewarm $id after 5 attempts" >&2
              exit 1
            fi
          done
