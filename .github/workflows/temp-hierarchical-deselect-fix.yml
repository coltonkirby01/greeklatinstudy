name: Temporary hierarchical deselect fix

on:
  push:
    branches:
      - fix/hierarchical-deselect-restore

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hierarchical-deselect-restore
          fetch-depth: 0

      - name: Apply hierarchy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new)

          # Greek: remove the separate deselected section, make every normal
          # parent selection restore per-card exclusions beneath it, and make
          # parent mixed states reflect exact-card exclusions.
          path = Path('src/pages/greek-page.tsx')
          s = path.read_text()
          s, n = re.subn(
              r'\n  const excludedEntries = useMemo\(\(\) => \{.*?\n  \}, \[decks, excludedCards\.refs\]\);\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('failed to remove Greek excludedEntries')

          # Existing group-state calls should account for exact exclusions.
          s = s.replace('groupState(selected,', 'groupSelectionState(')

          # Route every ordinary group checkbox/disclosure through one helper.
          s = re.sub(
              r'setSelected\(\(current\) => updateSet\(current, (.+?), checked\)\)',
              r'changeGroups(\1, checked)',
              s,
          )

          # Leaf group checkboxes also show mixed when an exact child is excluded.
          s = re.sub(
              r'checked=\{selected\.has\(([^)]+)\)\}',
              r'checked={groupSelectionState([\1]).checked} mixed={groupSelectionState([\1]).mixed}',
              s,
          )

          s = must_replace(
              s,
              'onChange={setIncludeSavedCards} hint={savedHint}',
              'onChange={changeSavedCards} hint={savedHint}',
              'Greek Saved Cards change handler',
          )

          marker = '  function exactCardSelected(sourceDeck: DeckDefinition, card: StudyCard) {'
          helpers = '''  function cardsForGroupKeys(values: readonly string[]) {\n    if (!decks) return [];\n    const allowed = new Set(values);\n    const sourceDecks = [decks.foundation, decks.lesson3Vocabulary, decks.lesson3Grammar, decks.lesson4Vocabulary, decks.lesson4Grammar, decks.lesson5Vocabulary, decks.lesson5Grammar];\n    return sourceDecks.flatMap((sourceDeck) => sourceDeck.cards.flatMap((card) => {\n      const key = groupKeyForCard(sourceDeck, card);\n      return key && allowed.has(key) ? [{ deckId: sourceDeck.id, cardId: card.id }] : [];\n    }));\n  }\n\n  function groupSelectionState(values: readonly string[]) {\n    const base = groupState(selected, values);\n    const hasExcluded = cardsForGroupKeys(values).some(({ deckId, cardId }) => excludedCards.isExcluded(deckId, cardId));\n    return { ...base, checked: base.checked && !hasExcluded, mixed: base.mixed || (base.checked && hasExcluded) };\n  }\n\n  function changeGroups(values: readonly string[], checked: boolean) {\n    setSelected((current) => updateSet(current, values, checked));\n    if (checked) excludedCards.setMany(cardsForGroupKeys(values), false);\n  }\n\n  function changeSavedCards(checked: boolean) {\n    setIncludeSavedCards(checked);\n    if (!checked || !decks) return;\n    const sourceDecks = [decks.foundation, decks.lesson3Vocabulary, decks.lesson3Grammar, decks.lesson4Vocabulary, decks.lesson4Grammar, decks.lesson5Vocabulary, decks.lesson5Grammar];\n    const refs = sourceDecks.flatMap((sourceDeck) => sourceDeck.cards\n      .filter((card) => savedCards.refs.has(savedCardRef(sourceDeck.id, card.id)))\n      .map((card) => ({ deckId: sourceDeck.id, cardId: card.id })));\n    excludedCards.setMany(refs, false);\n  }\n\n'''
          if marker not in s:
              raise SystemExit('missing Greek exactCardSelected marker')
          s = s.replace(marker, helpers + marker, 1)

          s, n = re.subn(
              r'\n      \{excludedEntries\.length > 0 && <FilterSection title="Individually deselected".*?</FilterSection>\}\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('failed to remove Greek Individually deselected section')
          path.write_text(s)

          # Latin already restores exclusions for its Dickinson/category/grammar
          # parents. Remove the redundant restoration section and make Saved Cards
          # follow the same parent-restores-children rule.
          path = Path('src/pages/latin-page.tsx')
          s = path.read_text()
          s, n = re.subn(
              r'\n  const excludedEntries = useMemo\(\(\) => \{.*?\n  \}, \[activeParadigmDeck, excludedCards\.refs, passiveParadigmDeck, vocabularyDeck\]\);\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('failed to remove Latin excludedEntries')

          marker = '  function toggleMaterial(material: Material, checked: boolean) {'
          helper = '''  function changeSavedCards(checked: boolean) {\n    setIncludeSavedCards(checked);\n    if (!checked) return;\n    const sourceDecks = [vocabularyDeck, activeParadigmDeck, passiveParadigmDeck].filter((item): item is DeckDefinition => Boolean(item));\n    const refs = sourceDecks.flatMap((sourceDeck) => sourceDeck.cards\n      .filter((card) => savedCards.refs.has(savedCardRef(sourceDeck.id, card.id)))\n      .map((card) => ({ deckId: sourceDeck.id, cardId: card.id })));\n    excludedCards.setMany(refs, false);\n  }\n\n'''
          if marker not in s:
              raise SystemExit('missing Latin toggleMaterial marker')
          s = s.replace(marker, helper + marker, 1)
          s = must_replace(
              s,
              'onChange={setIncludeSavedCards} hint="Your saved Latin cards"',
              'onChange={changeSavedCards} hint="Your saved Latin cards"',
              'Latin Saved Cards change handler',
          )
          s, n = re.subn(
              r'\n        \{excludedEntries\.length > 0 && <FilterSection title="Individually deselected".*?</FilterSection>\}\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('failed to remove Latin Individually deselected section')
          path.write_text(s)

          # Learner-facing guide.
          path = Path('src/pages/how-site-works.tsx')
          s = path.read_text()
          old = '<p>On the answer side of every built-in Greek and Latin card, press <strong>D</strong> or click <strong>Deselect card</strong> to mark that card for removal. The button changes to <strong>Deselected</strong>, but the current card stays visible and the Start gate does not reopen. When you press Space to Save &amp; Next, the grade is saved, that card is removed from the active Choose cards pool, and study continues directly to the next selected card. The exact checkbox in Choose cards reflects the same individual selection state, so the card can be restored there. <strong>Select all</strong> restores all individually deselected cards.</p>'
          new = '<p>On the answer side of every built-in Greek and Latin card, press <strong>D</strong> or click <strong>Deselect card</strong> to mark that card for removal. The button changes to <strong>Deselected</strong>, but the current card stays visible and the Start gate does not reopen. When you press Space to Save &amp; Next, the grade is saved, that card is removed from the active Choose cards pool, and study continues directly to the next selected card. The exact checkbox in Choose cards reflects the same individual selection state. Reselecting that exact card restores it, and selecting any parent heading that contains the card restores all cards beneath that parent. There is no separate deselected-card list.</p>'
          s = must_replace(s, old, new, 'learner guide deselection paragraph')
          path.write_text(s)

          # Permanent future-agent instructions.
          path = Path('.github/copilot-instructions.md')
          s = path.read_text()
          old = '- Parent checkbox selection and disclosure expansion are independent. Mixed states must remain correct when only some exact cards are selected.\n- Filter changes narrow the pool only; never delete progress for deselected cards.'
          new = '- Parent checkbox selection and disclosure expansion are independent. Mixed states must remain correct when only some exact cards are selected, including cards excluded with D.\n- Selecting any parent checkbox MUST restore every per-card exclusion beneath that parent. Reselecting an exact card restores that card only. Do not add a separate **Individually deselected** section; deselected cards remain represented only by their normal exact-card checkbox and parent mixed states.\n- Filter changes narrow the pool only; never delete progress for deselected cards.'
          s = must_replace(s, old, new, 'copilot hierarchy instructions')
          old = '- Per-card exclusions are stored through `src/features/study/card-exclusions.ts`. Exact-card checkboxes and the answer-side D action must read/write that same state. Top-level **Select all** clears individual exclusions.'
          new = '- Per-card exclusions are stored through `src/features/study/card-exclusions.ts`. Exact-card checkboxes and the answer-side D action must read/write that same state. Top-level **Select all** and every selected parent scope clear the relevant individual exclusions beneath them.'
          s = must_replace(s, old, new, 'copilot exclusion persistence instructions')
          path.write_text(s)

          path = Path('AGENTS.md')
          s = path.read_text()
          old = '- Every built-in card must also be individually selectable from the language-level Choose cards menu. Exact-card selection and the answer-side Deselect action use the same persistent per-card exclusion state; they are not parallel selection systems.\n- Dickinson\'s exact-card selector is grouped into nested ten-card ranges (`1–10`, `11–20`, and so on) so all 997 entries remain individually reachable without making the menu unusable.'
          new = '- Every built-in card must also be individually selectable from the language-level Choose cards menu. Exact-card selection and the answer-side Deselect action use the same persistent per-card exclusion state; they are not parallel selection systems. There is no separate Individually deselected list.\n- A D-deselected card is restored either by reselecting its exact checkbox or by selecting any parent checkbox that contains it; parent mixed states must reflect excluded descendants. Selecting a parent restores all excluded cards beneath that parent without affecting learning history.\n- Dickinson\'s exact-card selector is grouped into nested ten-card ranges (`1–10`, `11–20`, and so on) so all 997 entries remain individually reachable without making the menu unusable.'
          s = must_replace(s, old, new, 'AGENTS hierarchy instructions')
          path.write_text(s)

          # Regression coverage for the contract and removal of the old UI.
          path = Path('tests/how-site-works.test.ts')
          s = path.read_text()
          old = '    expect(guide).toContain("Space to Save &amp; Next");\n    expect(guide).toContain("does not erase saved reviews, mastery, scheduling, Stats, or long-term Adaptive memory");'
          new = '    expect(guide).toContain("Space to Save &amp; Next");\n    expect(guide).toContain("selecting any parent heading that contains the card restores all cards beneath that parent");\n    expect(guide).toContain("There is no separate deselected-card list");\n    const greek = fs.readFileSync("src/pages/greek-page.tsx", "utf8");\n    const latin = fs.readFileSync("src/pages/latin-page.tsx", "utf8");\n    expect(greek).not.toContain(\'title="Individually deselected"\');\n    expect(latin).not.toContain(\'title="Individually deselected"\');\n    expect(greek).toContain("function changeGroups");\n    expect(greek).toContain("groupSelectionState");\n    expect(latin).toContain("function changeSavedCards");\n    expect(guide).toContain("does not erase saved reviews, mastery, scheduling, Stats, or long-term Adaptive memory");'
          s = must_replace(s, old, new, 'how-site-works regression assertions')
          path.write_text(s)
          PY

      - name: Verify patch is clean
        run: git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/greek-page.tsx src/pages/latin-page.tsx src/pages/how-site-works.tsx tests/how-site-works.test.ts .github/copilot-instructions.md AGENTS.md
          git commit -m "Make card deselection hierarchical"
          git push origin HEAD:fix/hierarchical-deselect-restore
