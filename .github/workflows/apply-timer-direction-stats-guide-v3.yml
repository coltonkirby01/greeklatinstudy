name: Apply timer direction stats guide updates v3

on:
  push:
    branches:
      - feature/timer-direction-stats-guide

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timer-direction-stats-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reapply verified patch and update stale guide regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-timer-direction-stats-guide-v2.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'apply-v2.py', 'exec'), {})

          test = Path('tests/how-site-works.test.ts')
          text = test.read_text()
          old = '    expect(instructions).toContain("INITIAL_COVERAGE_MULTIPLIER = 1.25");'
          new = '    expect(instructions).toContain("Diverse uses 1.05×");\n    expect(instructions).toContain("Standard uses 1.25×");\n    expect(instructions).toContain("Concentrated uses 1.75×");'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale coverage assertion, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))

          current = Path('.github/workflows/apply-timer-direction-stats-guide-v3.yml')
          if current.exists(): current.unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify maintenance, tests, and Pages build
        run: npm run check
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine timer, direction controls, session scoring, and guide"
          git push origin HEAD:feature/timer-direction-stats-guide
