name: Temporary Translation Vocab patch

on:
  push:
    branches:
      - feature/translation-vocab-deck

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/translation-vocab-deck
      - name: Patch learner-facing pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count} for {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Translation Helper: add account-backed lexical choice saver beside lookup results.
          replace_once(
              "src/pages/translation-helper-page.tsx",
              'import { lookupLatinWords } from "../features/translation/latin-words-lookup";\n',
              'import { lookupLatinWords } from "../features/translation/latin-words-lookup";\nimport { TranslationVocabSaver } from "../features/translation/translation-vocab-saver";\n',
          )
          replace_once(
              "src/pages/translation-helper-page.tsx",
              '''            {language === "latin" && <a className="translation-source-link" href="https://latin-words.com/" target="_blank" rel="noreferrer">Source <ExternalLink aria-hidden="true" /></a>}\n          </div>\n\n          {!selectedWord && <div className="translation-empty">''',
              '''            {language === "latin" && <a className="translation-source-link" href="https://latin-words.com/" target="_blank" rel="noreferrer">Source <ExternalLink aria-hidden="true" /></a>}\n          </div>\n\n          <TranslationVocabSaver language={language} surfaceWord={selectedWord} matches={displayedMatches} user={user} />\n\n          {!selectedWord && <div className="translation-empty">''',
          )

          # Greek study app: add a separate selectable Translation Helper Vocab deck.
          replace_once(
              "src/pages/greek-page-v2.tsx",
              'import { oneWordVocabularyGloss } from "../features/greek/vocabulary-selector-gloss";\n',
              'import { oneWordVocabularyGloss } from "../features/greek/vocabulary-selector-gloss";\nimport { TranslationVocabDeckFilter, useTranslationVocabStudy } from "../features/translation/translation-vocab-study";\n',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '  const [includeSavedCards, setIncludeSavedCards] = useState(() => loadIncludeSavedCards("greek"));\n  const resumeSession = useMemo(() => {',
              '  const [includeSavedCards, setIncludeSavedCards] = useState(() => loadIncludeSavedCards("greek"));\n  const translationVocab = useTranslationVocabStudy("greek", user, direction, excludedCards);\n  const resumeSession = useMemo(() => {',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '    if (newTestamentCards.length) next.push({ id: "new-testament-vocabulary", label: "New Testament Vocab (Kubo)", deck: decks.newTestamentVocabulary, cards: newTestamentCards, studyKey: direction, direction });\n\n    if (includeSavedCards) {',
              '    if (newTestamentCards.length) next.push({ id: "new-testament-vocabulary", label: "New Testament Vocab (Kubo)", deck: decks.newTestamentVocabulary, cards: newTestamentCards, studyKey: direction, direction });\n    if (translationVocab.source) next.push(translationVocab.source);\n\n    if (includeSavedCards) {',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '  }, [decks, direction, excludedCards.refs, foundationCards, includeSavedCards, lessonCardSets, newTestamentCards, savedCards.refs]);',
              '  }, [decks, direction, excludedCards.refs, foundationCards, includeSavedCards, lessonCardSets, newTestamentCards, savedCards.refs, translationVocab.source]);',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '  const resetKey = `${direction}|${[...selected].sort().join("|")}|saved:${savedSelectionKey}|excluded:${excludedCards.signature}`;',
              '  const resetKey = `${direction}|${[...selected].sort().join("|")}|saved:${savedSelectionKey}|translation:${translationVocab.signature}|excluded:${excludedCards.signature}`;',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '    {(error || savedCards.error) && <div className="inline-alert">{error ?? savedCards.error}</div>}',
              '    {(error || savedCards.error || translationVocab.error) && <div className="inline-alert">{error ?? savedCards.error ?? translationVocab.error}</div>}',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '      <FilterSection title="Quick select" onAll={() => { setSelected(new Set(allKeys)); excludedCards.clear(); }} onNone={() => { setSelected(new Set()); setIncludeSavedCards(false); }}>',
              '      <FilterSection title="Quick select" onAll={() => { setSelected(new Set(allKeys)); excludedCards.clear(); translationVocab.selectAll(); }} onNone={() => { setSelected(new Set()); setIncludeSavedCards(false); translationVocab.selectNone(); }}>',
          )
          replace_once(
              "src/pages/greek-page-v2.tsx",
              '''        <FilterCheckbox label="All Endings" checked={endingsState.checked} mixed={endingsState.mixed} onChange={(checked) => changeGroups(allEndingKeys, checked)} />\n      </FilterSection>\n\n      <FilterDisclosure title="New Testament Vocab (Kubo)"''',
              '''        <FilterCheckbox label="All Endings" checked={endingsState.checked} mixed={endingsState.mixed} onChange={(checked) => changeGroups(allEndingKeys, checked)} />\n      </FilterSection>\n\n      <TranslationVocabDeckFilter study={translationVocab} />\n\n      <FilterDisclosure title="New Testament Vocab (Kubo)"''',
          )

          # Latin study app: same separate account-backed deck.
          replace_once(
              "src/pages/latin-page.tsx",
              'import { LatinParadigmTable } from "../features/latin/latin-paradigm-table";\n',
              'import { LatinParadigmTable } from "../features/latin/latin-paradigm-table";\nimport { TranslationVocabDeckFilter, useTranslationVocabStudy } from "../features/translation/translation-vocab-study";\n',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '  const [includeSavedCards, setIncludeSavedCards] = useState(() => loadIncludeSavedCards("latin"));\n\n  const resumeSession = useMemo(() => {',
              '  const [includeSavedCards, setIncludeSavedCards] = useState(() => loadIncludeSavedCards("latin"));\n  const translationVocab = useTranslationVocabStudy("latin", user, direction, excludedCards);\n\n  const resumeSession = useMemo(() => {',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '''    if (passiveSubjunctiveActive && passiveSubjunctiveDeck && passiveSubjunctiveStudyCards.length) {\n      next.push({ id: "passive-subjunctive-paradigms", label: "Passive subjunctive paradigm", deck: passiveSubjunctiveDeck, cards: passiveSubjunctiveStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n\n    if (includeSavedCards) {''',
              '''    if (passiveSubjunctiveActive && passiveSubjunctiveDeck && passiveSubjunctiveStudyCards.length) {\n      next.push({ id: "passive-subjunctive-paradigms", label: "Passive subjunctive paradigm", deck: passiveSubjunctiveDeck, cards: passiveSubjunctiveStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n    if (translationVocab.source) next.push(translationVocab.source);\n\n    if (includeSavedCards) {''',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '  }, [activeParadigmDeck, activeParadigmStudyCards, activeParadigmsActive, activeSubjunctiveActive, activeSubjunctiveDeck, activeSubjunctiveStudyCards, adjectiveParadigmDeck, adjectiveParadigmStudyCards, adjectiveParadigmsActive, direction, excludedCards.refs, includeSavedCards, participlesDeck, participleStudyCards, participlesActive, passiveParadigmDeck, passiveParadigmStudyCards, passiveParadigmsActive, passiveSubjunctiveActive, passiveSubjunctiveDeck, passiveSubjunctiveStudyCards, savedCards.refs, vocabularyActive, vocabularyCards, vocabularyDeck]);',
              '  }, [activeParadigmDeck, activeParadigmStudyCards, activeParadigmsActive, activeSubjunctiveActive, activeSubjunctiveDeck, activeSubjunctiveStudyCards, adjectiveParadigmDeck, adjectiveParadigmStudyCards, adjectiveParadigmsActive, direction, excludedCards.refs, includeSavedCards, participlesDeck, participleStudyCards, participlesActive, passiveParadigmDeck, passiveParadigmStudyCards, passiveParadigmsActive, passiveSubjunctiveActive, passiveSubjunctiveDeck, passiveSubjunctiveStudyCards, savedCards.refs, translationVocab.source, vocabularyActive, vocabularyCards, vocabularyDeck]);',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '  const resetKey = `${direction}|${[...materials].sort().join(",")}|v:${selectionKey(vocabularyParts)}|p:${selectionKey(paradigmCards)}|saved:${savedSelectionKey}|excluded:${excludedCards.signature}`;',
              '  const resetKey = `${direction}|${[...materials].sort().join(",")}|v:${selectionKey(vocabularyParts)}|p:${selectionKey(paradigmCards)}|saved:${savedSelectionKey}|translation:${translationVocab.signature}|excluded:${excludedCards.signature}`;',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '''  function selectAllCards() {\n    setMaterials(new Set<Material>(["vocabulary", "adjective-paradigms", "participles", "active-indicative-paradigms", "active-subjunctive-paradigms", "passive-indicative-paradigms", "passive-subjunctive-paradigms"]));\n    setVocabularyParts(null);\n    setParadigmCards(null);\n    excludedCards.clear();\n  }''',
              '''  function selectAllCards() {\n    setMaterials(new Set<Material>(["vocabulary", "adjective-paradigms", "participles", "active-indicative-paradigms", "active-subjunctive-paradigms", "passive-indicative-paradigms", "passive-subjunctive-paradigms"]));\n    setVocabularyParts(null);\n    setParadigmCards(null);\n    excludedCards.clear();\n    translationVocab.selectAll();\n  }''',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '''  function deselectAllCards() {\n    setMaterials(new Set());\n    setVocabularyParts(new Set());\n    setParadigmCards(new Set());\n    setIncludeSavedCards(false);\n  }''',
              '''  function deselectAllCards() {\n    setMaterials(new Set());\n    setVocabularyParts(new Set());\n    setParadigmCards(new Set());\n    setIncludeSavedCards(false);\n    translationVocab.selectNone();\n  }''',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '      {(vocabularyError || paradigmError || savedCards.error) && <div className="inline-alert">{vocabularyError ?? paradigmError ?? savedCards.error}</div>}',
              '      {(vocabularyError || paradigmError || savedCards.error || translationVocab.error) && <div className="inline-alert">{vocabularyError ?? paradigmError ?? savedCards.error ?? translationVocab.error}</div>}',
          )
          replace_once(
              "src/pages/latin-page.tsx",
              '''        <FilterSection title="Quick select" description="Cards you save with the card button or S shortcut are private to your account or this guest browser." onAll={selectAllCards} onNone={deselectAllCards}>\n          <SavedCardsFilter items={savedCardFilterItems} ready={savedCards.ready} onAllChange={changeSavedCards} onItemChange={changeSavedCardEntry} />\n        </FilterSection>\n\n\n        <FilterDisclosure''',
              '''        <FilterSection title="Quick select" description="Cards you save with the card button or S shortcut are private to your account or this guest browser." onAll={selectAllCards} onNone={deselectAllCards}>\n          <SavedCardsFilter items={savedCardFilterItems} ready={savedCards.ready} onAllChange={changeSavedCards} onItemChange={changeSavedCardEntry} />\n        </FilterSection>\n\n        <TranslationVocabDeckFilter study={translationVocab} />\n\n        <FilterDisclosure''',
          )

          # Learner guide: explain the separate deck and lexical-sense chooser.
          replace_once(
              "src/pages/how-site-works.tsx",
              '<p><strong>Saved Cards</strong> is an expandable parent inside Choose cards. Open it to see the individual saved Greek or Latin cards and include or exclude them from the active study pool one at a time; the parent checkbox still selects or clears the saved-card group as a whole. Each saved-card row also has a red <strong>Deselect</strong> action on the right for removing that card from Saved Cards generally. That removal stays pending while the Saved Cards disclosure remains open, so the same row offers <strong>Reselect</strong> as an undo; closing the disclosure commits any removals. Saved-card membership is separate from the ordinary checkbox selection used for the cards currently being studied, so restoring a card to Saved Cards does not by itself add it to the active study pool.</p>\n',
              '<p><strong>Saved Cards</strong> is an expandable parent inside Choose cards. Open it to see the individual saved Greek or Latin cards and include or exclude them from the active study pool one at a time; the parent checkbox still selects or clears the saved-card group as a whole. Each saved-card row also has a red <strong>Deselect</strong> action on the right for removing that card from Saved Cards generally. That removal stays pending while the Saved Cards disclosure remains open, so the same row offers <strong>Reselect</strong> as an undo; closing the disclosure commits any removals. Saved-card membership is separate from the ordinary checkbox selection used for the cards currently being studied, so restoring a card to Saved Cards does not by itself add it to the active study pool.</p>\n            <p><strong>Translation Helper Vocab</strong> is a separate selectable deck in both language apps for signed-in users. In the Translation Helper, a word lookup includes checkboxes for the genuine dictionary entry or sense you want to study. Grammatical analyses that differ only by case, number, tense, mood, voice, person, or other inflection are combined rather than becoming duplicate vocabulary choices. Saved lexical choices sync to the account, appear in this deck, and can be selected as a whole or one card at a time.</p>\n',
          )
          replace_once(
              "src/pages/how-site-works.tsx",
              '<p>When signed in, progress, sessions, saved cards, timing, and review history synchronize with your private account so the same learning state can continue on another device. Guest study can work locally on the current device, but cloud synchronization requires an account.</p>',
              '<p>When signed in, progress, sessions, saved cards, Translation Helper texts and vocabulary choices, timing, and review history synchronize with your private account so the same learning state can continue on another device. Guest study can work locally on the current device, but cloud synchronization requires an account.</p>',
          )
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/translation-helper-page.tsx src/pages/greek-page-v2.tsx src/pages/latin-page.tsx src/pages/how-site-works.tsx
          git commit -m "Integrate Translation Helper vocab deck"
          git push origin HEAD:feature/translation-vocab-deck
