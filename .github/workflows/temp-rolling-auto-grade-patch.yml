name: Apply rolling auto-grade patch

on:
  push:
    branches:
      - chatgpt/rolling-auto-grade

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rolling-auto-grade
          fetch-depth: 0
      - name: Apply requested study behavior changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          # 1) Automatic correctness defaults: first 3 saved reviews Wrong, then
          # majority of the three most recent saved reviews for this card/mode.
          replace_once(
              "src/features/study/session-review.ts",
              '''export const EASY_RECALL_LIMIT_MS = 3_000;
          export const HARD_RECALL_START_MS = 10_000;
          export const AUTO_WRONG_REVIEW_COUNT = 7;

          export type AutoReviewDefaults = { result: ReviewResult; difficulty: ReviewDifficulty };

          /**
           * Suggested grade from active front-side recall time. The first seven saved
           * reviews of a card in the current study mode/direction default to Wrong;
           * review eight and later default to Right. Recall time only chooses the default
           * difficulty. The user can override either correctness or difficulty before saving.
           */
          export function autoReviewDefaults(responseTimeMs: number, priorReviews = 0): AutoReviewDefaults {
            const elapsed = normalizeResponseTime(responseTimeMs);
            const result: ReviewResult = priorReviews < AUTO_WRONG_REVIEW_COUNT ? "wrong" : "right";
            if (elapsed < EASY_RECALL_LIMIT_MS) return { result, difficulty: "easy" };
            if (elapsed < HARD_RECALL_START_MS) return { result, difficulty: "medium" };
            return { result, difficulty: "hard" };
          }
          ''',
              '''export const EASY_RECALL_LIMIT_MS = 3_000;
          export const HARD_RECALL_START_MS = 10_000;
          export const INITIAL_AUTO_WRONG_REVIEWS = 3;
          export const RECENT_AUTO_GRADE_WINDOW = 3;

          export type AutoReviewDefaults = { result: ReviewResult; difficulty: ReviewDifficulty };

          /**
           * Correctness defaults are personal learning-state suggestions. A card defaults
           * to Wrong for its first three saved reviews in the current study mode/direction.
           * Beginning with attempt four, the majority result from the three most recent
           * saved reviews wins. Recall time continues to choose only the default difficulty.
           */
          export function autoReviewResult(progress?: Pick<CardProgress, "reviews" | "history"> | null): ReviewResult {
            if (!progress || progress.reviews < INITIAL_AUTO_WRONG_REVIEWS || progress.history.length < RECENT_AUTO_GRADE_WINDOW) return "wrong";
            const recent = progress.history.slice(-RECENT_AUTO_GRADE_WINDOW);
            const right = recent.filter((review) => review.result === "right").length;
            return right >= 2 ? "right" : "wrong";
          }

          export function autoReviewDefaults(responseTimeMs: number, progress?: Pick<CardProgress, "reviews" | "history"> | null): AutoReviewDefaults {
            const elapsed = normalizeResponseTime(responseTimeMs);
            const result = autoReviewResult(progress);
            if (elapsed < EASY_RECALL_LIMIT_MS) return { result, difficulty: "easy" };
            if (elapsed < HARD_RECALL_START_MS) return { result, difficulty: "medium" };
            return { result, difficulty: "hard" };
          }
          ''',
          )

          replace_once(
              "src/features/study/study-session.tsx",
              'const suggested = autoReviewDefaults(responseTimeMs, modeState ? getCardProgress(modeState, current.id).reviews : 0);',
              'const suggested = autoReviewDefaults(responseTimeMs, modeState ? getCardProgress(modeState, current.id) : undefined);',
          )
          replace_once(
              "src/features/study/multi-source-study-session.tsx",
              'const suggested = autoReviewDefaults(responseTimeMs, currentState ? getCardProgress(currentState, current.card.id).reviews : 0);',
              'const suggested = autoReviewDefaults(responseTimeMs, currentState ? getCardProgress(currentState, current.card.id) : undefined);',
          )

          # 2) Current-session preview follows the session selected in the toolbar,
          # across all loaded modes/decks for that language rather than current card filters.
          replace_once(
              "src/features/study/multi-source-study-session.tsx",
              'const sessionProgress = useMemo(() => sessionProgressSummary(visibleCandidates.map(({ source, card }) => ({ progress: getCardProgress(states.get(source.id) ?? modeFor(source), card.id) })), session.id), [modeFor, session.id, states, visibleCandidates]);',
              '''const sessionProgress = useMemo(() => {
            const items = Object.values(envelopes).flatMap((envelope) => Object.values(envelope.modes).flatMap((mode) => Object.values(mode.cards).map((progress) => ({ progress }))));
            return sessionProgressSummary(items, session.id);
          }, [envelopes, session.id]);''',
          )

          # Make the sidebar a compact session-stat preview rather than mixing in
          # current-selection availability/coverage.
          replace_once(
              "src/features/study/study-session-ui.tsx",
              '''export function StudySidebar({ copy, direction, stats, initialReviewed, initialTotal, initialPercent, priority, priorityPrompt, cardCopy }: {
            copy: DirectionalCardCopy;
            direction: StudyDirection;
            stats: StudyStats;
            initialReviewed: number;
            initialTotal: number;
            initialPercent: number;
            priority: Priority;''',
              '''export function StudySidebar({ copy, direction, stats, priority, priorityPrompt, cardCopy }: {
            copy: DirectionalCardCopy;
            direction: StudyDirection;
            stats: StudyStats;
            priority: Priority;''',
          )
          replace_once(
              "src/features/study/study-session-ui.tsx",
              '<div className="stats-grid"><div className="stat-tile"><span>Available</span><strong>{stats.available}</strong></div>',
              '<div className="stats-grid"><div className="stat-tile"><span>Reviews</span><strong>{stats.totalReviews}</strong></div>',
          )
          replace_once(
              "src/features/study/study-session-ui.tsx",
              '      <div className="progress-block"><div className="progress-label"><span>Initial review · {initialReviewed}/{initialTotal}</span><strong>{Math.round(initialPercent)}%</strong></div><div className="progress-track" role="progressbar" aria-label="Initial review of selected cards" aria-valuenow={initialPercent} aria-valuemin={0} aria-valuemax={100}><span style={{ width: `${initialPercent}%` }} /></div></div>\n',
              '',
          )
          replace_once(
              "src/features/study/study-session.tsx",
              '<StudySidebar copy={copy} direction={direction} stats={stats} initialReviewed={sessionProgress.initialReviewed} initialTotal={sessionProgress.initialTotal} initialPercent={sessionProgress.initialPercent} priority={priority} priorityPrompt={priorityPrompt} />',
              '<StudySidebar copy={copy} direction={direction} stats={stats} priority={priority} priorityPrompt={priorityPrompt} />',
          )
          replace_once(
              "src/features/study/multi-source-study-session.tsx",
              '<StudySidebar copy={copy} direction={direction} stats={stats} initialReviewed={sessionProgress.initialReviewed} initialTotal={sessionProgress.initialTotal} initialPercent={sessionProgress.initialPercent} priority={priority} priorityPrompt={priorityPrompt} cardCopy={(card) => { const source = sourceByCard.get(`${card.deckId}:${card.id}`); return directionalCopy(card, source?.direction ?? direction); }} />',
              '<StudySidebar copy={copy} direction={direction} stats={stats} priority={priority} priorityPrompt={priorityPrompt} cardCopy={(card) => { const source = sourceByCard.get(`${card.deckId}:${card.id}`); return directionalCopy(card, source?.direction ?? direction); }} />',
          )

          # 3) Ending-chart audio: no punctuation pauses within a vertical column;
          # Eleven v3 [pause] occurs only between columns.
          replace_once(
              "supabase/functions/course-audio/lesson3-assets.ts",
              '''function paradigm(id: string, label: string, forms: readonly string[]): Lesson3CourseAudioAsset {
            const text = forms.join(", ");
            return {
              id,
              label,
              canonicalIpa: greekToClassicalIpa(text),
              ttsText: greekToElevenLabsIpa(text),
            };
          }
          ''',
              '''function paradigm(id: string, label: string, forms: readonly string[]): Lesson3CourseAudioAsset {
            const text = forms.join(", ");
            return {
              id,
              label,
              canonicalIpa: greekToClassicalIpa(text),
              ttsText: greekToElevenLabsIpa(text),
            };
          }

          function endingChart(id: string, label: string, columns: readonly (readonly string[])[]): Lesson3CourseAudioAsset {
            const forms = columns.flat();
            const spokenColumns = columns.map((column) => column.map((form) => greekToElevenLabsIpa(form)).filter(Boolean).join(" "));
            return {
              id,
              label,
              canonicalIpa: greekToClassicalIpa(forms.join(", ")),
              ttsText: spokenColumns.filter(Boolean).join(" [pause] "),
            };
          }
          ''',
          )
          replace_once(
              "supabase/functions/course-audio/lesson3-assets.ts",
              '''  paradigm("lesson3-chart-present-active-indicative-endings", "Present Active Indicative Endings", [
              "-ω",
              "-εις",
              "-ει",
              "-ομεν",
              "-ετε",
              "-ουσι(ν)",
            ]),
            paradigm("lesson3-chart-present-active-infinitive-endings", "Present Active Infinitive Ending", ["-ειν"]),
            paradigm("lesson3-chart-present-active-imperative-endings", "Present Active Imperative Endings", [
              "-ε",
              "-έτω",
              "-ετε",
              "-όντων",
            ]),''',
              '''  endingChart("lesson3-chart-present-active-indicative-endings", "Present Active Indicative Endings", [
              ["-ω", "-εις", "-ει"],
              ["-ομεν", "-ετε", "-ουσι(ν)"],
            ]),
            endingChart("lesson3-chart-present-active-infinitive-endings", "Present Active Infinitive Ending", [["-ειν"]]),
            endingChart("lesson3-chart-present-active-imperative-endings", "Present Active Imperative Endings", [
              ["-ε", "-έτω"],
              ["-ετε", "-όντων"],
            ]),''',
          )

          replace_once(
              "supabase/functions/course-audio/lesson4-assets.ts",
              '''function paradigm(id: string, label: string, forms: readonly string[]): Lesson3CourseAudioAsset {
            const text = forms.join(", ");
            return {
              id,
              label,
              canonicalIpa: greekToClassicalIpa(text),
              ttsText: greekToElevenLabsIpa(text),
            };
          }
          ''',
              '''function paradigm(id: string, label: string, forms: readonly string[]): Lesson3CourseAudioAsset {
            const text = forms.join(", ");
            return {
              id,
              label,
              canonicalIpa: greekToClassicalIpa(text),
              ttsText: greekToElevenLabsIpa(text),
            };
          }

          function endingChart(id: string, label: string, columns: readonly (readonly string[])[]): Lesson3CourseAudioAsset {
            const forms = columns.flat();
            const spokenColumns = columns.map((column) => column.map((form) => greekToElevenLabsIpa(form)).filter(Boolean).join(" "));
            return {
              id,
              label,
              canonicalIpa: greekToClassicalIpa(forms.join(", ")),
              ttsText: spokenColumns.filter(Boolean).join(" [pause] "),
            };
          }
          ''',
          )
          replace_once(
              "supabase/functions/course-audio/lesson4-assets.ts",
              '''  paradigm("lesson4-chart-first-declension-endings-alpha", "First Declension Feminine Endings — α-type", [
              "-ᾱ", "-ᾱς", "-ᾳ", "-ᾱν", "-ᾱ",
              "-αι", "-ων", "-αις", "-ᾱς", "-αι",
            ]),
            paradigm("lesson4-chart-first-declension-endings-eta", "First Declension Feminine Endings — η-type", [
              "-η", "-ης", "-ῃ", "-ην", "-η",
              "-αι", "-ων", "-αις", "-ᾱς", "-αι",
            ]),''',
              '''  endingChart("lesson4-chart-first-declension-endings-alpha", "First Declension Feminine Endings — α-type", [
              ["-ᾱ", "-ᾱς", "-ᾳ", "-ᾱν", "-ᾱ"],
              ["-αι", "-ων", "-αις", "-ᾱς", "-αι"],
            ]),
            endingChart("lesson4-chart-first-declension-endings-eta", "First Declension Feminine Endings — η-type", [
              ["-η", "-ης", "-ῃ", "-ην", "-η"],
              ["-αι", "-ων", "-αις", "-ᾱς", "-αι"],
            ]),''',
          )

          # 4) Regression tests for rolling correctness and column-boundary audio.
          replace_once(
              "tests/session-review.test.ts",
              'import { AUTO_WRONG_REVIEW_COUNT, autoReviewDefaults, sessionProgressSummary } from "../src/features/study/session-review";',
              'import { INITIAL_AUTO_WRONG_REVIEWS, RECENT_AUTO_GRADE_WINDOW, autoReviewDefaults, autoReviewResult, sessionProgressSummary } from "../src/features/study/session-review";',
          )
          replace_once(
              "tests/session-review.test.ts",
              '''describe("automatic review defaults", () => {
            it("defaults the first seven reviews to wrong and review eight onward to right", () => {
              expect(AUTO_WRONG_REVIEW_COUNT).toBe(7);
              expect(autoReviewDefaults(2_999, 0)).toEqual({ result: "wrong", difficulty: "easy" });
              expect(autoReviewDefaults(3_000, 6)).toEqual({ result: "wrong", difficulty: "medium" });
              expect(autoReviewDefaults(9_999, 7)).toEqual({ result: "right", difficulty: "medium" });
              expect(autoReviewDefaults(10_000, 12)).toEqual({ result: "right", difficulty: "hard" });
            });
          });''',
              '''describe("automatic review defaults", () => {
            it("defaults attempts one through three to wrong", () => {
              expect(INITIAL_AUTO_WRONG_REVIEWS).toBe(3);
              expect(RECENT_AUTO_GRADE_WINDOW).toBe(3);
              expect(autoReviewResult(progressWith())).toBe("wrong");
              expect(autoReviewResult(progressWith(review("a", 1, "right", "easy", 1_000)))).toBe("wrong");
              expect(autoReviewResult(progressWith(review("a", 1, "right", "easy", 1_000), review("b", 2, "right", "easy", 1_000)))).toBe("wrong");
            });

            it("uses the majority of the three most recent saved reviews after attempt three", () => {
              const mostlyRight = progressWith(
                review("a", 1, "wrong", "hard", 10_000),
                review("b", 2, "right", "medium", 5_000),
                review("c", 3, "right", "easy", 2_000),
              );
              mostlyRight.reviews = 3;
              const mostlyWrong = progressWith(
                review("a", 1, "right", "easy", 2_000),
                review("b", 2, "wrong", "medium", 5_000),
                review("c", 3, "wrong", "hard", 10_000),
              );
              mostlyWrong.reviews = 3;
              expect(autoReviewResult(mostlyRight)).toBe("right");
              expect(autoReviewResult(mostlyWrong)).toBe("wrong");
              expect(autoReviewDefaults(2_999, mostlyRight)).toEqual({ result: "right", difficulty: "easy" });
              expect(autoReviewDefaults(10_000, mostlyWrong)).toEqual({ result: "wrong", difficulty: "hard" });
            });

            it("changes with the rolling last-three window rather than lifetime accuracy", () => {
              const progress = progressWith(
                review("a", 1, "right", "easy", 1_000),
                review("b", 2, "right", "easy", 1_000),
                review("c", 3, "right", "easy", 1_000),
                review("d", 4, "wrong", "hard", 10_000),
                review("e", 5, "wrong", "hard", 10_000),
              );
              progress.reviews = 5;
              expect(autoReviewResult(progress)).toBe("wrong");
            });
          });''',
          )

          replace_once(
              "tests/classical-greek-audio.test.ts",
              '''  it("never pronounces parenthetical material or morphology dashes", () => {
              expect(stripUnpronouncedGreekNotation("παιδεύ-ουσι(ν)")).toBe("παιδεύουσι");
              expect(greekToElevenLabsIpa("παιδεύ-ουσι(ν)")).not.toContain("n/");
            });''',
              '''  it("puts ending-chart pauses only between vertical columns", () => {
              const lesson3Indicative = resolveBuiltinGreekAsset("lesson3-chart-present-active-indicative-endings");
              const lesson3Imperative = resolveBuiltinGreekAsset("lesson3-chart-present-active-imperative-endings");
              const lesson4Alpha = resolveBuiltinGreekAsset("lesson4-chart-first-declension-endings-alpha");
              const lesson4Eta = resolveBuiltinGreekAsset("lesson4-chart-first-declension-endings-eta");
              for (const asset of [lesson3Indicative, lesson3Imperative, lesson4Alpha, lesson4Eta]) {
                expect(asset?.ttsText.match(/\\[pause\\]/gu)).toHaveLength(1);
                const columns = asset?.ttsText.split(" [pause] ") ?? [];
                expect(columns).toHaveLength(2);
                expect(columns.every((column) => !column.includes(","))).toBe(true);
              }
              expect(resolveBuiltinGreekAsset("lesson3-chart-present-active-infinitive-endings")?.ttsText).not.toContain("[pause]");
            });

            it("never pronounces parenthetical material or morphology dashes", () => {
              expect(stripUnpronouncedGreekNotation("παιδεύ-ουσι(ν)")).toBe("παιδεύουσι");
              expect(greekToElevenLabsIpa("παιδεύ-ουσι(ν)")).not.toContain("n/");
            });''',
          )

          # 5) Preserve these behaviors for future coding-agent edits.
          p = Path(".github/copilot-instructions.md")
          text = p.read_text()
          marker = "- Preserve selector behavior, mixed/indeterminate states, saved progress, and independent lesson/deck histories while simplifying copy.\n"
          addition = marker + "- Automatic correctness is user-progress-specific: attempts 1–3 for a card in a study mode/direction default to **Wrong**; from attempt 4 onward, use the majority result of that card's three most recent saved reviews. Never replace this with a global/shared default or merge Forward/Reverse histories.\n- The **Current session** sidebar must summarize the session selected in the card-app session selector across that session's loaded Greek/Latin envelopes, independent of the currently visible card filters. Keep it aligned with the Stats page's session scope.\n- For Greek ending-only chart audio on Eleven v3, read each chart column top-to-bottom without punctuation pauses inside the column and place exactly one `[pause]` between vertical columns.\n"
          if marker not in text:
              raise SystemExit("copilot instruction marker missing")
          p.write_text(text.replace(marker, addition, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/study/session-review.ts src/features/study/study-session.tsx src/features/study/multi-source-study-session.tsx src/features/study/study-session-ui.tsx supabase/functions/course-audio/lesson3-assets.ts supabase/functions/course-audio/lesson4-assets.ts tests/session-review.test.ts tests/classical-greek-audio.test.ts .github/copilot-instructions.md
          git diff --cached --check
          git commit -m "Use rolling auto-grade and session-specific stats"
          git push origin HEAD:chatgpt/rolling-auto-grade
