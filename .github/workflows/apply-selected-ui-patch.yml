name: Apply selected cards UI patch

on:
  push:
    branches:
      - feature/saved-selected-panel-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply selected cards UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/saved-selected-panel-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-selected-ui-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/greek-page-v2.tsx src/pages/latin-page.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply selected cards UI patch"
          git push origin HEAD:feature/saved-selected-panel-ui
