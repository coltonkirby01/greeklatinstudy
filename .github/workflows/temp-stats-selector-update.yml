name: Temporary Stats selector update

on:
  push:
    branches:
      - "chatgpt/stats-selector-hygiene"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stats-selector-hygiene
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          stats = Path("src/pages/stats-page.tsx")
          text = stats.read_text()
          anchor = '  const filterLabel = allSessionsSelected ? "All sessions" : `${selectedSessions?.size ?? 0} of ${value.sessions.length} sessions`;\n\n  return <main className="page-shell stats-page">'
          insert = '''  const filterLabel = allSessionsSelected ? "All sessions" : `${selectedSessions?.size ?? 0} of ${value.sessions.length} sessions`;
          const sortedSessions = [...value.sessions].sort((a, b) => Number(Boolean(b.builtin)) - Number(Boolean(a.builtin)) || b.startedAt - a.startedAt);

          function renderSessionChoice(session: SessionSummary) {
            const editing = editingSessionId === session.id, busy = busySessionId === session.id;
            return <div className="stats-session-choice" key={session.id}>
              <input type="checkbox" aria-label={`Include ${session.name} in Stats`} checked={allSessionsSelected || (selectedSessions?.has(session.id) ?? false)} onChange={(event) => toggleSession(session.id, event.target.checked)} />
              <div style={{ minWidth: 0, flex: "1 1 auto", display: "grid", gap: "0.14rem" }}>
                {editing ? <input autoFocus value={draftName} maxLength={80} aria-label="Session name" disabled={busy} style={{ margin: 0, width: "100%", minWidth: 0, padding: "0.25rem 0.4rem", border: "1px solid var(--line)", borderRadius: "6px", background: "var(--surface)", color: "var(--foreground)", font: "inherit", fontWeight: 700 }} onFocus={(event) => event.currentTarget.select()} onChange={(event) => setDraftName(event.target.value)} onBlur={() => void saveRename(session)} onKeyDown={(event) => { if (event.key === "Enter") { event.preventDefault(); event.currentTarget.blur(); } if (event.key === "Escape") { event.preventDefault(); setEditingSessionId(null); setDraftName(""); } }} /> : session.builtin ? <strong>{sessionName(session)}</strong> : <strong role="button" tabIndex={0} title="Double-click to rename" onDoubleClick={() => beginRename(session)} onKeyDown={(event) => { if (event.key === "Enter" || event.key === "F2") beginRename(session); }}>{sessionName(session)}</strong>}
                <small>{dateTime(session.startedAt)} · {session.reviews} reviews · score {session.score.toFixed(1)}{session.inferred ? " · imported legacy history" : ""}</small>
              </div>
              <div className="stats-filter-actions"><button className="text-button" type="button" onClick={() => setSelectedSessions(new Set([session.id]))}>Only</button>{!session.builtin && <button className="text-button" type="button" disabled={busy} onClick={() => void deleteSession(session)}>Delete</button>}</div>
            </div>;
          }

          return <main className="page-shell stats-page">'''
          if anchor not in text:
            raise SystemExit("stats anchor not found")
          text = text.replace(anchor, insert, 1)
          start = '      {value.sessions.length ? <div className="stats-session-picker">'
          end = '}</div> : <p className="stats-empty">Complete reviews to create sessions.</p>}'
          s = text.find(start)
          if s < 0:
            raise SystemExit("session picker start not found")
          e = text.find(end, s)
          if e < 0:
            raise SystemExit("session picker end not found")
          e += len(end)
          replacement = '      {value.sessions.length ? <div className="stats-session-columns">{(["Greek", "Latin"] as const).map((language) => <section className="stats-session-column" key={language} aria-labelledby={`stats-${language.toLowerCase()}-sessions`}><h3 id={`stats-${language.toLowerCase()}-sessions`}>{language}</h3><div className="stats-session-picker">{sortedSessions.filter((session) => session.language === language).map(renderSessionChoice)}</div></section>)}</div> : <p className="stats-empty">Complete reviews to create sessions.</p>}'
          text = text[:s] + replacement + text[e:]
          stats.write_text(text)

          css = Path("src/pages/stats-page.css")
          c = css.read_text()
          old = '''.stats-session-picker {
            max-height: 22rem;
            overflow: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.55rem;
          }
          '''
          new = '''.stats-session-columns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            align-items: start;
          }

          .stats-session-column {
            min-width: 0;
            display: grid;
            gap: 0.55rem;
          }

          .stats-session-column h3 {
            margin: 0;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--line);
            color: var(--foreground);
            font-family: var(--font-serif);
          }

          .stats-session-picker {
            max-height: 22rem;
            overflow: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.55rem;
          }
          '''
          old = old.replace("          ", "")
          new = new.replace("          ", "")
          if old not in c:
            raise SystemExit("picker CSS not found")
          c = c.replace(old, new, 1)
          c = re.sub(r'\n\.stats-session-language \{.*?\n\}\n', '\n', c, count=1, flags=re.S)
          c = c.replace('  .stats-overview-grid,\n  .stats-analysis-grid,\n  .stats-trend-grid,\n  .stats-session-picker {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }', '  .stats-overview-grid,\n  .stats-analysis-grid,\n  .stats-trend-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }', 1)
          c = c.replace('  .stats-overview-grid,\n  .stats-analysis-grid,\n  .stats-trend-grid,\n  .stats-session-picker {\n    grid-template-columns: 1fr;\n  }', '  .stats-overview-grid,\n  .stats-analysis-grid,\n  .stats-trend-grid,\n  .stats-session-columns {\n    grid-template-columns: 1fr;\n  }', 1)
          css.write_text(c)

          p = Path(".github/copilot-instructions.md")
          i = p.read_text()
          marker = '- Stats must show Learner and Reviewer as selectable session scopes even before they have reviews.\n'
          addition = '- Stats session selection is grouped into two language columns on desktop: **Greek** on the left and **Latin** on the right. Use one heading per column; do not repeat a Greek/Latin label inside each session card.\n'
          if addition not in i:
            if marker not in i:
              raise SystemExit("session instruction marker not found")
            i = i.replace(marker, marker + addition, 1)
          p.write_text(i)

          p = Path("scripts/maintenance-check.mjs")
          m = p.read_text()
          marker = '  ["retired footer tagline", /Active recall\\s*·\\s*adaptive review\\s*·\\s*reading aloud/],\n'
          addition = '  ["redundant Stats session language sublabel", /stats-session-language/],\n'
          if addition not in m:
            if marker not in m:
              raise SystemExit("maintenance marker not found")
            m = m.replace(marker, marker + addition, 1)
          p.write_text(m)
          PY
          git rm .github/workflows/temp-stats-selector-update.yml
          npm ci
          npm run check
          git config user.name "chatgpt-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/stats-page.tsx src/pages/stats-page.css .github/copilot-instructions.md scripts/maintenance-check.mjs
          git commit -m "Group Stats sessions by language"
          git push origin HEAD:chatgpt/stats-selector-hygiene
