name: Add Latin subjunctive paradigms

on:
  push:
    branches: [feature/latin-subjunctive-paradigms]
    paths: [.github/workflows/add-latin-subjunctive.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/latin-subjunctive-paradigms
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply subjunctive integration
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing expected text in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          page = "src/pages/latin-page.tsx"
          replace_once(page,
              'import { loadLatinActiveIndicativeParadigmsDeck } from "../data/latin-active-indicative-paradigms";\n',
              'import { loadLatinActiveIndicativeParadigmsDeck } from "../data/latin-active-indicative-paradigms";\nimport { loadLatinActiveSubjunctiveParadigmsDeck } from "../data/latin-active-subjunctive-paradigms";\n')
          replace_once(page,
              'import { loadLatinPassiveIndicativeParadigmsDeck } from "../data/latin-passive-indicative-paradigms";\n',
              'import { loadLatinPassiveIndicativeParadigmsDeck } from "../data/latin-passive-indicative-paradigms";\nimport { loadLatinPassiveSubjunctiveParadigmsDeck } from "../data/latin-passive-subjunctive-paradigms";\n')
          replace_once(page,
              'const passiveParadigmTenses = ["Present Tense", "Imperfect Tense", "Future Tense"] as const;\n',
              'const passiveParadigmTenses = ["Present Tense", "Imperfect Tense", "Future Tense"] as const;\nconst subjunctiveParadigmTenses = ["Present Tense", "Imperfect Tense", "Perfect Tense", "Pluperfect Tense"] as const;\n')
          replace_once(page,
              'const prefix = title.startsWith("Active") ? "Active Indicative" : "Passive Indicative";',
              'const prefix = title.replace(/ Paradigms$/u, "");')
          replace_once(page,
              '  const { value: activeParadigmDeck, error: activeParadigmError } = useAsync(loadLatinActiveIndicativeParadigmsDeck, []);\n',
              '  const { value: activeParadigmDeck, error: activeParadigmError } = useAsync(loadLatinActiveIndicativeParadigmsDeck, []);\n  const { value: activeSubjunctiveDeck, error: activeSubjunctiveError } = useAsync(loadLatinActiveSubjunctiveParadigmsDeck, []);\n')
          replace_once(page,
              '  const { value: passiveParadigmDeck, error: passiveParadigmError } = useAsync(loadLatinPassiveIndicativeParadigmsDeck, []);\n',
              '  const { value: passiveParadigmDeck, error: passiveParadigmError } = useAsync(loadLatinPassiveIndicativeParadigmsDeck, []);\n  const { value: passiveSubjunctiveDeck, error: passiveSubjunctiveError } = useAsync(loadLatinPassiveSubjunctiveParadigmsDeck, []);\n')
          replace_once(page,
              '  const activeParadigmIds = useMemo(() => activeParadigmDeck?.cards.map((card) => card.id) ?? [], [activeParadigmDeck]);\n',
              '  const activeParadigmIds = useMemo(() => activeParadigmDeck?.cards.map((card) => card.id) ?? [], [activeParadigmDeck]);\n  const activeSubjunctiveIds = useMemo(() => activeSubjunctiveDeck?.cards.map((card) => card.id) ?? [], [activeSubjunctiveDeck]);\n')
          replace_once(page,
              '  const passiveParadigmIds = useMemo(() => passiveParadigmDeck?.cards.map((card) => card.id) ?? [], [passiveParadigmDeck]);\n',
              '  const passiveParadigmIds = useMemo(() => passiveParadigmDeck?.cards.map((card) => card.id) ?? [], [passiveParadigmDeck]);\n  const passiveSubjunctiveIds = useMemo(() => passiveSubjunctiveDeck?.cards.map((card) => card.id) ?? [], [passiveSubjunctiveDeck]);\n')
          replace_once(page,
              '  const allParadigmIds = useMemo(() => [...adjectiveParadigmIds, ...participleIds, ...activeParadigmIds, ...passiveParadigmIds], [activeParadigmIds, adjectiveParadigmIds, participleIds, passiveParadigmIds]);\n',
              '  const allParadigmIds = useMemo(() => [...adjectiveParadigmIds, ...participleIds, ...activeParadigmIds, ...passiveParadigmIds, ...activeSubjunctiveIds, ...passiveSubjunctiveIds], [activeParadigmIds, activeSubjunctiveIds, adjectiveParadigmIds, participleIds, passiveParadigmIds, passiveSubjunctiveIds]);\n')
          replace_once(page,
              '  const activeParadigmsActive = materials.has("active-indicative-paradigms");\n',
              '  const activeParadigmsActive = materials.has("active-indicative-paradigms");\n  const activeSubjunctiveActive = materials.has("active-subjunctive-paradigms");\n')
          replace_once(page,
              '  const passiveParadigmsActive = materials.has("passive-indicative-paradigms");\n',
              '  const passiveParadigmsActive = materials.has("passive-indicative-paradigms");\n  const passiveSubjunctiveActive = materials.has("passive-subjunctive-paradigms");\n')
          replace_once(page,
              '  const activeParadigmSelectedCount = activeParadigmDeck?.cards.filter((card) => activeParadigmsActive && selected(paradigmCards, card.id) && !excludedCards.isExcluded(activeParadigmDeck.id, card.id)).length ?? 0;\n',
              '  const activeParadigmSelectedCount = activeParadigmDeck?.cards.filter((card) => activeParadigmsActive && selected(paradigmCards, card.id) && !excludedCards.isExcluded(activeParadigmDeck.id, card.id)).length ?? 0;\n  const activeSubjunctiveSelectedCount = activeSubjunctiveDeck?.cards.filter((card) => activeSubjunctiveActive && selected(paradigmCards, card.id) && !excludedCards.isExcluded(activeSubjunctiveDeck.id, card.id)).length ?? 0;\n')
          replace_once(page,
              '  const passiveParadigmSelectedCount = passiveParadigmDeck?.cards.filter((card) => passiveParadigmsActive && selected(paradigmCards, card.id) && !excludedCards.isExcluded(passiveParadigmDeck.id, card.id)).length ?? 0;\n',
              '  const passiveParadigmSelectedCount = passiveParadigmDeck?.cards.filter((card) => passiveParadigmsActive && selected(paradigmCards, card.id) && !excludedCards.isExcluded(passiveParadigmDeck.id, card.id)).length ?? 0;\n  const passiveSubjunctiveSelectedCount = passiveSubjunctiveDeck?.cards.filter((card) => passiveSubjunctiveActive && selected(paradigmCards, card.id) && !excludedCards.isExcluded(passiveSubjunctiveDeck.id, card.id)).length ?? 0;\n')
          replace_once(page,
              '  const activeParadigmState = { checked: Boolean(activeParadigmIds.length && activeParadigmSelectedCount === activeParadigmIds.length), mixed: activeParadigmSelectedCount > 0 && activeParadigmSelectedCount < activeParadigmIds.length, selectedCount: activeParadigmSelectedCount };\n',
              '  const activeParadigmState = { checked: Boolean(activeParadigmIds.length && activeParadigmSelectedCount === activeParadigmIds.length), mixed: activeParadigmSelectedCount > 0 && activeParadigmSelectedCount < activeParadigmIds.length, selectedCount: activeParadigmSelectedCount };\n  const activeSubjunctiveState = { checked: Boolean(activeSubjunctiveIds.length && activeSubjunctiveSelectedCount === activeSubjunctiveIds.length), mixed: activeSubjunctiveSelectedCount > 0 && activeSubjunctiveSelectedCount < activeSubjunctiveIds.length, selectedCount: activeSubjunctiveSelectedCount };\n')
          replace_once(page,
              '  const passiveParadigmState = { checked: Boolean(passiveParadigmIds.length && passiveParadigmSelectedCount === passiveParadigmIds.length), mixed: passiveParadigmSelectedCount > 0 && passiveParadigmSelectedCount < passiveParadigmIds.length, selectedCount: passiveParadigmSelectedCount };\n',
              '  const passiveParadigmState = { checked: Boolean(passiveParadigmIds.length && passiveParadigmSelectedCount === passiveParadigmIds.length), mixed: passiveParadigmSelectedCount > 0 && passiveParadigmSelectedCount < passiveParadigmIds.length, selectedCount: passiveParadigmSelectedCount };\n  const passiveSubjunctiveState = { checked: Boolean(passiveSubjunctiveIds.length && passiveSubjunctiveSelectedCount === passiveSubjunctiveIds.length), mixed: passiveSubjunctiveSelectedCount > 0 && passiveSubjunctiveSelectedCount < passiveSubjunctiveIds.length, selectedCount: passiveSubjunctiveSelectedCount };\n')
          replace_once(page,
              '  const grammarSelectedCount = adjectiveParadigmState.selectedCount + participlesState.selectedCount + activeParadigmState.selectedCount + passiveParadigmState.selectedCount;\n  const grammarChecked = adjectiveParadigmState.checked && participlesState.checked && activeParadigmState.checked && passiveParadigmState.checked;\n  const grammarMixed = (adjectiveParadigmsActive || participlesActive || activeParadigmsActive || passiveParadigmsActive) && (!grammarChecked || adjectiveParadigmState.mixed || participlesState.mixed || activeParadigmState.mixed || passiveParadigmState.mixed);\n',
              '  const grammarSelectedCount = adjectiveParadigmState.selectedCount + participlesState.selectedCount + activeParadigmState.selectedCount + passiveParadigmState.selectedCount + activeSubjunctiveState.selectedCount + passiveSubjunctiveState.selectedCount;\n  const grammarChecked = adjectiveParadigmState.checked && participlesState.checked && activeParadigmState.checked && passiveParadigmState.checked && activeSubjunctiveState.checked && passiveSubjunctiveState.checked;\n  const grammarMixed = (adjectiveParadigmsActive || participlesActive || activeParadigmsActive || passiveParadigmsActive || activeSubjunctiveActive || passiveSubjunctiveActive) && (!grammarChecked || adjectiveParadigmState.mixed || participlesState.mixed || activeParadigmState.mixed || passiveParadigmState.mixed || activeSubjunctiveState.mixed || passiveSubjunctiveState.mixed);\n')
          replace_once(page,
              '  const activeParadigmStudyCards = useMemo(() => activeParadigmDeck?.cards.filter((card) => selected(paradigmCards, card.id) && !excludedCards.refs.has(savedCardRef(activeParadigmDeck.id, card.id))) ?? [], [activeParadigmDeck, excludedCards.refs, paradigmCards]);\n',
              '  const activeParadigmStudyCards = useMemo(() => activeParadigmDeck?.cards.filter((card) => selected(paradigmCards, card.id) && !excludedCards.refs.has(savedCardRef(activeParadigmDeck.id, card.id))) ?? [], [activeParadigmDeck, excludedCards.refs, paradigmCards]);\n  const activeSubjunctiveStudyCards = useMemo(() => activeSubjunctiveDeck?.cards.filter((card) => selected(paradigmCards, card.id) && !excludedCards.refs.has(savedCardRef(activeSubjunctiveDeck.id, card.id))) ?? [], [activeSubjunctiveDeck, excludedCards.refs, paradigmCards]);\n')
          replace_once(page,
              '  const passiveParadigmStudyCards = useMemo(() => passiveParadigmDeck?.cards.filter((card) => selected(paradigmCards, card.id) && !excludedCards.refs.has(savedCardRef(passiveParadigmDeck.id, card.id))) ?? [], [excludedCards.refs, paradigmCards, passiveParadigmDeck]);\n',
              '  const passiveParadigmStudyCards = useMemo(() => passiveParadigmDeck?.cards.filter((card) => selected(paradigmCards, card.id) && !excludedCards.refs.has(savedCardRef(passiveParadigmDeck.id, card.id))) ?? [], [excludedCards.refs, paradigmCards, passiveParadigmDeck]);\n  const passiveSubjunctiveStudyCards = useMemo(() => passiveSubjunctiveDeck?.cards.filter((card) => selected(paradigmCards, card.id) && !excludedCards.refs.has(savedCardRef(passiveSubjunctiveDeck.id, card.id))) ?? [], [excludedCards.refs, paradigmCards, passiveSubjunctiveDeck]);\n')
          replace_once(page,
              '    const decks = [vocabularyDeck, adjectiveParadigmDeck, participlesDeck, activeParadigmDeck, passiveParadigmDeck].filter((item): item is DeckDefinition => Boolean(item));\n',
              '    const decks = [vocabularyDeck, adjectiveParadigmDeck, participlesDeck, activeParadigmDeck, passiveParadigmDeck, activeSubjunctiveDeck, passiveSubjunctiveDeck].filter((item): item is DeckDefinition => Boolean(item));\n')
          replace_once(page,
              '  }, [activeParadigmDeck, adjectiveParadigmDeck, participlesDeck, passiveParadigmDeck, savedCards.refs, vocabularyDeck]);\n',
              '  }, [activeParadigmDeck, activeSubjunctiveDeck, adjectiveParadigmDeck, participlesDeck, passiveParadigmDeck, passiveSubjunctiveDeck, savedCards.refs, vocabularyDeck]);\n')
          replace_once(page,
              '    if (activeParadigmsActive && activeParadigmDeck && activeParadigmStudyCards.length) {\n      next.push({ id: "active-indicative-paradigms", label: "Active indicative paradigm", deck: activeParadigmDeck, cards: activeParadigmStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n',
              '    if (activeParadigmsActive && activeParadigmDeck && activeParadigmStudyCards.length) {\n      next.push({ id: "active-indicative-paradigms", label: "Active indicative paradigm", deck: activeParadigmDeck, cards: activeParadigmStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n    if (activeSubjunctiveActive && activeSubjunctiveDeck && activeSubjunctiveStudyCards.length) {\n      next.push({ id: "active-subjunctive-paradigms", label: "Active subjunctive paradigm", deck: activeSubjunctiveDeck, cards: activeSubjunctiveStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n')
          replace_once(page,
              '    if (passiveParadigmsActive && passiveParadigmDeck && passiveParadigmStudyCards.length) {\n      next.push({ id: "passive-indicative-paradigms", label: "Passive indicative paradigm", deck: passiveParadigmDeck, cards: passiveParadigmStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n',
              '    if (passiveParadigmsActive && passiveParadigmDeck && passiveParadigmStudyCards.length) {\n      next.push({ id: "passive-indicative-paradigms", label: "Passive indicative paradigm", deck: passiveParadigmDeck, cards: passiveParadigmStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n    if (passiveSubjunctiveActive && passiveSubjunctiveDeck && passiveSubjunctiveStudyCards.length) {\n      next.push({ id: "passive-subjunctive-paradigms", label: "Passive subjunctive paradigm", deck: passiveSubjunctiveDeck, cards: passiveSubjunctiveStudyCards, studyKey: paradigmStudyKey, direction });\n    }\n')
          replace_once(page,
              '      appendSaved("saved-active-indicative-paradigms", activeParadigmDeck, paradigmStudyKey);\n      appendSaved("saved-passive-indicative-paradigms", passiveParadigmDeck, paradigmStudyKey);\n',
              '      appendSaved("saved-active-indicative-paradigms", activeParadigmDeck, paradigmStudyKey);\n      appendSaved("saved-active-subjunctive-paradigms", activeSubjunctiveDeck, paradigmStudyKey);\n      appendSaved("saved-passive-indicative-paradigms", passiveParadigmDeck, paradigmStudyKey);\n      appendSaved("saved-passive-subjunctive-paradigms", passiveSubjunctiveDeck, paradigmStudyKey);\n')
          replace_once(page,
              '  }, [activeParadigmDeck, activeParadigmStudyCards, activeParadigmsActive, adjectiveParadigmDeck, adjectiveParadigmStudyCards, adjectiveParadigmsActive, direction, excludedCards.refs, includeSavedCards, participlesDeck, participleStudyCards, participlesActive, passiveParadigmDeck, passiveParadigmStudyCards, passiveParadigmsActive, savedCards.refs, vocabularyActive, vocabularyCards, vocabularyDeck]);\n',
              '  }, [activeParadigmDeck, activeParadigmStudyCards, activeParadigmsActive, activeSubjunctiveActive, activeSubjunctiveDeck, activeSubjunctiveStudyCards, adjectiveParadigmDeck, adjectiveParadigmStudyCards, adjectiveParadigmsActive, direction, excludedCards.refs, includeSavedCards, participlesDeck, participleStudyCards, participlesActive, passiveParadigmDeck, passiveParadigmStudyCards, passiveParadigmsActive, passiveSubjunctiveActive, passiveSubjunctiveDeck, passiveSubjunctiveStudyCards, savedCards.refs, vocabularyActive, vocabularyCards, vocabularyDeck]);\n')
          replace_once(page,
              '    const sourceDecks = [vocabularyDeck, adjectiveParadigmDeck, participlesDeck, activeParadigmDeck, passiveParadigmDeck].filter((item): item is DeckDefinition => Boolean(item));\n',
              '    const sourceDecks = [vocabularyDeck, adjectiveParadigmDeck, participlesDeck, activeParadigmDeck, passiveParadigmDeck, activeSubjunctiveDeck, passiveSubjunctiveDeck].filter((item): item is DeckDefinition => Boolean(item));\n')
          replace_once(page,
              '    if (activeParadigmsActive) activeParadigmIds.forEach((id) => next.add(id));\n    if (passiveParadigmsActive) passiveParadigmIds.forEach((id) => next.add(id));\n',
              '    if (activeParadigmsActive) activeParadigmIds.forEach((id) => next.add(id));\n    if (activeSubjunctiveActive) activeSubjunctiveIds.forEach((id) => next.add(id));\n    if (passiveParadigmsActive) passiveParadigmIds.forEach((id) => next.add(id));\n    if (passiveSubjunctiveActive) passiveSubjunctiveIds.forEach((id) => next.add(id));\n')
          replace_once(page,
              '    if (material === "active-indicative-paradigms") return activeParadigmDeck;\n    if (material === "passive-indicative-paradigms") return passiveParadigmDeck;\n',
              '    if (material === "active-indicative-paradigms") return activeParadigmDeck;\n    if (material === "active-subjunctive-paradigms") return activeSubjunctiveDeck;\n    if (material === "passive-indicative-paradigms") return passiveParadigmDeck;\n    if (material === "passive-subjunctive-paradigms") return passiveSubjunctiveDeck;\n')
          replace_once(page,
              '        next.add("active-indicative-paradigms");\n        next.add("passive-indicative-paradigms");\n',
              '        next.add("active-indicative-paradigms");\n        next.add("active-subjunctive-paradigms");\n        next.add("passive-indicative-paradigms");\n        next.add("passive-subjunctive-paradigms");\n')
          replace_once(page,
              '        next.delete("active-indicative-paradigms");\n        next.delete("passive-indicative-paradigms");\n',
              '        next.delete("active-indicative-paradigms");\n        next.delete("active-subjunctive-paradigms");\n        next.delete("passive-indicative-paradigms");\n        next.delete("passive-subjunctive-paradigms");\n')
          replace_once(page,
              '      const refs = [adjectiveParadigmDeck, participlesDeck, activeParadigmDeck, passiveParadigmDeck].filter((item): item is DeckDefinition => Boolean(item)).flatMap((sourceDeck) => sourceDeck.cards.map((card) => ({ deckId: sourceDeck.id, cardId: card.id })));\n',
              '      const refs = [adjectiveParadigmDeck, participlesDeck, activeParadigmDeck, passiveParadigmDeck, activeSubjunctiveDeck, passiveSubjunctiveDeck].filter((item): item is DeckDefinition => Boolean(item)).flatMap((sourceDeck) => sourceDeck.cards.map((card) => ({ deckId: sourceDeck.id, cardId: card.id })));\n')
          replace_once(page,
              '    setMaterials(new Set<Material>(["vocabulary", "adjective-paradigms", "participles", "active-indicative-paradigms", "passive-indicative-paradigms"]));\n',
              '    setMaterials(new Set<Material>(["vocabulary", "adjective-paradigms", "participles", "active-indicative-paradigms", "active-subjunctive-paradigms", "passive-indicative-paradigms", "passive-subjunctive-paradigms"]));\n')
          replace_once(page,
              '  const paradigmError = adjectiveParadigmError ?? participlesError ?? activeParadigmError ?? passiveParadigmError;\n',
              '  const paradigmError = adjectiveParadigmError ?? participlesError ?? activeParadigmError ?? activeSubjunctiveError ?? passiveParadigmError ?? passiveSubjunctiveError;\n')
          p = Path(page)
          text = p.read_text().replace('allParadigmIds.length || 46', 'allParadigmIds.length || 78')
          p.write_text(text)
          passive_filter = '''          <ParadigmDeckFilters
            title="Passive Indicative Paradigms"
            material="passive-indicative-paradigms"
            deck={passiveParadigmDeck}
            tenses={passiveParadigmTenses}
            active={passiveParadigmsActive}
            selection={paradigmCards}
            allParadigmIds={allParadigmIds}
            isExcluded={excludedCards.isExcluded}
            onRestore={excludedCards.restore}
            onExclude={excludedCards.exclude}
            onDeckChange={changeParadigmDeck}
            onValuesChange={changeParadigmValues}
          />
'''
          subj_filters = passive_filter + '''          <ParadigmDeckFilters
            title="Active Subjunctive Paradigms"
            material="active-subjunctive-paradigms"
            deck={activeSubjunctiveDeck}
            tenses={subjunctiveParadigmTenses}
            active={activeSubjunctiveActive}
            selection={paradigmCards}
            allParadigmIds={allParadigmIds}
            isExcluded={excludedCards.isExcluded}
            onRestore={excludedCards.restore}
            onExclude={excludedCards.exclude}
            onDeckChange={changeParadigmDeck}
            onValuesChange={changeParadigmValues}
          />
          <ParadigmDeckFilters
            title="Passive Subjunctive Paradigms"
            material="passive-subjunctive-paradigms"
            deck={passiveSubjunctiveDeck}
            tenses={subjunctiveParadigmTenses}
            active={passiveSubjunctiveActive}
            selection={paradigmCards}
            allParadigmIds={allParadigmIds}
            isExcluded={excludedCards.isExcluded}
            onRestore={excludedCards.restore}
            onExclude={excludedCards.exclude}
            onDeckChange={changeParadigmDeck}
            onValuesChange={changeParadigmValues}
          />
'''
          replace_once(page, passive_filter, subj_filters)
          p = Path(page)
          text = p.read_text()
          old = 'source.deck.id === adjectiveParadigmDeck?.id || source.deck.id === activeParadigmDeck?.id || source.deck.id === passiveParadigmDeck?.id'
          new = 'source.deck.id === adjectiveParadigmDeck?.id || source.deck.id === activeParadigmDeck?.id || source.deck.id === passiveParadigmDeck?.id || source.deck.id === activeSubjunctiveDeck?.id || source.deck.id === passiveSubjunctiveDeck?.id'
          if text.count(old) != 2:
              raise SystemExit(f"Expected two paradigm renderer matches, found {text.count(old)}")
          p.write_text(text.replace(old, new).replace('card.category ?? "Indicative paradigm"', 'card.category ?? "Latin paradigm"'))

          prefs = "src/features/study/filter-preferences.ts"
          replace_once(prefs,
              'export type LatinMaterial = "vocabulary" | "active-indicative-paradigms" | "passive-indicative-paradigms" | "adjective-paradigms" | "participles";',
              'export type LatinMaterial = "vocabulary" | "active-indicative-paradigms" | "active-subjunctive-paradigms" | "passive-indicative-paradigms" | "passive-subjunctive-paradigms" | "adjective-paradigms" | "participles";')
          replace_once(prefs,
              'const LATIN_MATERIALS = new Set<LatinMaterial>(["vocabulary", "active-indicative-paradigms", "passive-indicative-paradigms", "adjective-paradigms", "participles"]);',
              'const LATIN_MATERIALS = new Set<LatinMaterial>(["vocabulary", "active-indicative-paradigms", "active-subjunctive-paradigms", "passive-indicative-paradigms", "passive-subjunctive-paradigms", "adjective-paradigms", "participles"]);')

          catalog = "src/features/study/builtin-study-catalog.ts"
          replace_once(catalog,
              'import { loadLatinActiveIndicativeParadigmsDeck } from "../../data/latin-active-indicative-paradigms";\n',
              'import { loadLatinActiveIndicativeParadigmsDeck } from "../../data/latin-active-indicative-paradigms";\nimport { loadLatinActiveSubjunctiveParadigmsDeck } from "../../data/latin-active-subjunctive-paradigms";\n')
          replace_once(catalog,
              'import { loadLatinPassiveIndicativeParadigmsDeck } from "../../data/latin-passive-indicative-paradigms";\n',
              'import { loadLatinPassiveIndicativeParadigmsDeck } from "../../data/latin-passive-indicative-paradigms";\nimport { loadLatinPassiveSubjunctiveParadigmsDeck } from "../../data/latin-passive-subjunctive-paradigms";\n')
          replace_once(catalog,
              '  { id: "latin-active-indicative-paradigms", language: "Latin", source: "Active Indicative Paradigms", load: loadLatinActiveIndicativeParadigmsDeck, modes: [{ mode: "Charts", direction: "forward", studyKey: "chart" }, { mode: "Reverse", direction: "reverse", studyKey: "reverse" }] },\n',
              '  { id: "latin-active-indicative-paradigms", language: "Latin", source: "Active Indicative Paradigms", load: loadLatinActiveIndicativeParadigmsDeck, modes: [{ mode: "Charts", direction: "forward", studyKey: "chart" }, { mode: "Reverse", direction: "reverse", studyKey: "reverse" }] },\n  { id: "latin-active-subjunctive-paradigms", language: "Latin", source: "Active Subjunctive Paradigms", load: loadLatinActiveSubjunctiveParadigmsDeck, modes: [{ mode: "Charts", direction: "forward", studyKey: "chart" }, { mode: "Reverse", direction: "reverse", studyKey: "reverse" }] },\n')
