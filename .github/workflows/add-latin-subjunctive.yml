name: Add Latin subjunctive paradigms

on:
  push:
    branches: [feature/latin-subjunctive-paradigms]
    paths:
      - .github/workflows/add-latin-subjunctive.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/latin-subjunctive-paradigms
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply subjunctive integration
        run: python scripts/integrate-latin-subjunctive.py
      - name: Remove temporary integration files
        run: rm scripts/integrate-latin-subjunctive.py .github/workflows/add-latin-subjunctive.yml
      - run: npm ci
      - name: Verify maintenance, tests, and Pages build
        run: npm run check
      - name: Commit integrated subjunctive support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Latin subjunctive paradigms"
          git push origin HEAD:feature/latin-subjunctive-paradigms
