name: Apply New Testament vocabulary integration v4

on:
  push:
    branches: [feature/new-testament-vocab]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-testament-vocab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integration
        run: python scripts/apply-new-testament-vocab.py
      - name: Install dependencies
        run: npm ci
      - name: Verify maintenance, tests, and Pages build
        run: |
          npm run maintain:check
          npm test
          npm run build:pages
      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-new-testament-vocab.yml .github/workflows/apply-new-testament-vocab-v2.yml .github/workflows/apply-new-testament-vocab-v3.yml .github/workflows/apply-new-testament-vocab-v4.yml scripts/apply-new-testament-vocab.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add frequency-ranked New Testament Greek vocabulary"
          git push origin HEAD:feature/new-testament-vocab
