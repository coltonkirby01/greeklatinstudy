name: Move Lesson 4 articles under Endings
on:
  push:
    branches: [chatgpt/lesson4-article-under-endings]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/lesson4-article-under-endings
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/greek-page.tsx')
          s = p.read_text()
          old_endings = 'const lesson4EndingsKeys = [keys.firstDeclensionEndingsAlpha, keys.firstDeclensionEndingsEta] as const;'
          new_endings = 'const lesson4EndingsKeys = [keys.firstDeclensionEndingsAlpha, keys.firstDeclensionEndingsEta, keys.feminineArticleSingular, keys.feminineArticlePlural] as const;'
          old_paradigms = 'const lesson4ParadigmKeys = [keys.firstDeclensionThea, keys.firstDeclensionHesychia, keys.firstDeclensionChora, keys.firstDeclensionSkene, keys.feminineArticleSingular, keys.feminineArticlePlural] as const;'
          new_paradigms = 'const lesson4ParadigmKeys = [keys.firstDeclensionThea, keys.firstDeclensionHesychia, keys.firstDeclensionChora, keys.firstDeclensionSkene] as const;'
          if s.count(old_endings) != 1 or s.count(old_paradigms) != 1:
              raise SystemExit('Lesson 4 grouping lines did not match expected source')
          s = s.replace(old_endings, new_endings, 1).replace(old_paradigms, new_paradigms, 1)
          p.write_text(s)

          rules = Path('.github/copilot-instructions.md')
          r = rules.read_text()
          note = '- In Greek Lesson 4, both feminine definite-article cards (singular and plural) belong under the `Endings` selector, not `Paradigms`; `Paradigms` is reserved for the model-noun paradigm cards.\n'
          if note not in r:
              r += '\n' + note
              rules.write_text(r)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/greek-page.tsx .github/copilot-instructions.md
          git diff --cached --check
          git commit -m "Group Lesson 4 articles under endings"
          git push origin HEAD:chatgpt/lesson4-article-under-endings
