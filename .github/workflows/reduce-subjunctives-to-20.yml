name: Reduce subjunctives to 20 cards

on:
  push:
    branches: [feature/reduce-subjunctives-to-20]
    paths:
      - .github/workflows/reduce-subjunctives-to-20.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reduce-subjunctives-to-20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the 20-card subjunctive structure
        run: python scripts/reduce-subjunctives-to-20.py
      - name: Remove temporary integration files
        run: rm scripts/reduce-subjunctives-to-20.py .github/workflows/reduce-subjunctives-to-20.yml
      - run: npm ci
      - name: Verify maintenance, tests, and Pages build
        run: npm run check
      - name: Commit the verified reduction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce Latin subjunctives to 20 cards"
          git push origin HEAD:feature/reduce-subjunctives-to-20
