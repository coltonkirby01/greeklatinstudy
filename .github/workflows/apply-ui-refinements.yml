name: Apply UI refinements
on:
  push:
    branches:
      - feature/sidebar-toolbar-polish
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-toolbar-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply requested UI changes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Shared toolbar: timer is the final/right-aligned control on desktop and remains last on responsive layouts.
          replace_once(
              'src/features/study/study-session-ui.tsx',
              'grid-template-columns:max-content minmax(145px,.72fr) minmax(145px,.72fr) minmax(220px,1.45fr) max-content',
              'grid-template-columns:minmax(145px,.72fr) minmax(145px,.72fr) minmax(220px,1.45fr) max-content',
          )
          replace_once(
              'src/features/study/study-session-ui.tsx',
              '.toolbar-timer{min-height:38px;',
              '.toolbar-timer{order:99;justify-self:end;min-height:38px;',
          )

          # Make Highest-Priority Review a seamless dropdown within the Progress panel.
          replace_once(
              'src/features/study/study-session-ui.tsx',
              '.coverage-details,.wrong-bank-details{margin-top:.55rem;',
              '.coverage-details,.wrong-bank-details,.priority-details{margin-top:.55rem;',
          )
          replace_once(
              'src/features/study/study-session-ui.tsx',
              '.coverage-details summary,.wrong-bank-details summary{cursor:pointer;',
              '.coverage-details summary,.wrong-bank-details summary,.priority-details summary{cursor:pointer;',
          )
          replace_once(
              'src/features/study/study-session-ui.tsx',
              '.coverage-details summary::-webkit-details-marker,.wrong-bank-details summary::-webkit-details-marker{display:none}',
              '.coverage-details summary::-webkit-details-marker,.wrong-bank-details summary::-webkit-details-marker,.priority-details summary::-webkit-details-marker{display:none}.priority-details{margin-top:.8rem}.priority-details .priority-summary-tail{display:inline-flex;align-items:center;gap:.45rem;color:var(--burgundy)}.priority-details .priority-summary-tail svg{width:.95rem;height:.95rem}.priority-details .priority-list{padding:0 .65rem .45rem}.priority-details .source-note{margin:.35rem .65rem .7rem}',
          )

          p = Path('src/features/study/study-session-ui.tsx')
          text = p.read_text()
          old = '''      <details className="wrong-bank-details">
        <summary><span>Wrong Bank</span><strong>{wrongBank.length}</strong></summary>
        {wrongBankActive && <span className="wrong-bank-status">Wrong Bank flash session active</span>}
        <div className="wrong-bank-list">
          {wrongBank.length ? wrongBank.map((item) => <div className="wrong-bank-item" key={item.key}>{item.label}</div>) : <div className="wrong-bank-empty">Cards marked Wrong during this page visit will appear here.</div>}
        </div>
        <button type="button" className="primary-button wrong-bank-flash" disabled={!wrongBank.length || wrongBankActive} onClick={onFlashWrongBank}>Flash These</button>
      </details>
    </section>
    <section className="panel-surface priority-panel">
      <div className="sidebar-heading"><div><p className="eyebrow">Prompts only</p><h2>Highest-Priority Review</h2></div><RotateCcw /></div>
      <div className="priority-list">{priority.map(({ card, progress, score }) => { const itemCopy = cardCopy ? cardCopy(card, direction) : directionalCopy(card, direction); return <div className="priority-row" key={`${card.deckId}:${card.id}`}><span className="priority-meta">{card.rank ? `#${card.rank}` : card.category ?? "Card"}</span><span className="priority-prompt">{priorityPrompt ? priorityPrompt(card, itemCopy) : itemCopy.prompt}<small>{priorityReason(progress)}</small></span><span className="priority-score">{Math.max(0, Math.round(score))}</span></div>; })}</div>
      <p className="source-note">Answers remain hidden. Only the currently selected cards can appear here; their correctness, difficulty, recall time, recency, strength, and due dates affect priority.</p>
    </section>'''
          new = '''      <details className="wrong-bank-details">
        <summary><span>Wrong Bank</span><strong>{wrongBank.length}</strong></summary>
        {wrongBankActive && <span className="wrong-bank-status">Wrong Bank flash session active</span>}
        <div className="wrong-bank-list">
          {wrongBank.length ? wrongBank.map((item) => <div className="wrong-bank-item" key={item.key}>{item.label}</div>) : <div className="wrong-bank-empty">Cards marked Wrong during this page visit will appear here.</div>}
        </div>
        <button type="button" className="primary-button wrong-bank-flash" disabled={!wrongBank.length || wrongBankActive} onClick={onFlashWrongBank}>Flash These</button>
      </details>
      <details className="priority-details">
        <summary><span>Highest-Priority Review</span><span className="priority-summary-tail"><strong>{priority.length}</strong><RotateCcw aria-hidden="true" /></span></summary>
        <div className="priority-list">{priority.map(({ card, progress, score }) => { const itemCopy = cardCopy ? cardCopy(card, direction) : directionalCopy(card, direction); return <div className="priority-row" key={`${card.deckId}:${card.id}`}><span className="priority-meta">{card.rank ? `#${card.rank}` : card.category ?? "Card"}</span><span className="priority-prompt">{priorityPrompt ? priorityPrompt(card, itemCopy) : itemCopy.prompt}<small>{priorityReason(progress)}</small></span><span className="priority-score">{Math.max(0, Math.round(score))}</span></div>; })}</div>
        <p className="source-note">Answers remain hidden. Only the currently selected cards can appear here; their correctness, difficulty, recall time, recency, strength, and due dates affect priority.</p>
      </details>
    </section>'''
          if old not in text:
              raise SystemExit('Expected sidebar priority block not found')
          p.write_text(text.replace(old, new, 1))

          # Keep lesson vocabulary and Kubo as genuinely separate vocabulary families.
          replace_once(
              'src/pages/greek-page-v2.tsx',
              'const allVocabularyKeys: string[] = [...lessonVocabularyKeys, ...newTestamentVocabularyKeys];',
              'const allVocabularyKeys: string[] = [...lessonVocabularyKeys];',
          )
          replace_once(
              'src/pages/greek-page-v2.tsx',
              'label: "New Testament Vocab", deck: decks.newTestamentVocabulary',
              'label: "New Testament Vocab (Kubo)", deck: decks.newTestamentVocabulary',
          )
          replace_once(
              'src/pages/greek-page-v2.tsx',
              '<FilterCheckbox label="All Vocabulary" checked={vocabularyState.checked}',
              '<FilterCheckbox label="All Lesson Vocabulary" checked={vocabularyState.checked}',
          )

          p = Path('src/pages/greek-page-v2.tsx')
          text = p.read_text()
          start = text.index('      <FilterDisclosure title="New Testament Vocab"')
          end_marker = '      {lessonCardSets.map(({ config, vocabularyDeck, grammarDeck }) => {'
          end = text.index(end_marker, start)
          block = text[start:end].rstrip()
          text = text[:start] + text[end:]
          block = block.replace('title="New Testament Vocab"', 'title="New Testament Vocab (Kubo)"', 1)
          anchor = '      </FilterSection>\n\n      <FilterDisclosure title="Lesson 1"'
          if anchor not in text:
              raise SystemExit('Greek Quick select anchor not found')
          text = text.replace(anchor, '      </FilterSection>\n\n' + block + '\n\n      <FilterDisclosure title="Lesson 1"', 1)
          p.write_text(text)

          # Learner-facing guide: reflect the final visible structure.
          replace_once(
              'src/pages/how-site-works.tsx',
              'In the main Greek and Latin apps, the Forward/Reverse control is inside <strong>Choose cards</strong>, leaving the first toolbar position for the response timer.',
              'In the main Greek and Latin apps, the Forward/Reverse control is inside <strong>Choose cards</strong>. The response timer sits at the far right of the study toolbar so card-order and session controls read naturally from left to right.',
          )
          replace_once(
              'src/pages/how-site-works.tsx',
              '<strong>New Testament Vocab</strong> is a separate Kubo source, ordered from highest to lowest New Testament frequency.',
              '<strong>New Testament Vocab (Kubo)</strong> is a separate vocabulary family from the lesson vocabulary selector, ordered from highest to lowest New Testament frequency.',
          )
          replace_once(
              'src/pages/how-site-works.tsx',
              'The response timer measures active time on the unrevealed question side and is the first control in the main Greek/Latin toolbar.',
              'The response timer measures active time on the unrevealed question side and sits at the far right of the main Greek/Latin toolbar.',
          )
          replace_once(
              'src/pages/how-site-works.tsx',
              'The Progress panel keeps a page-visit <strong>Wrong Bank</strong>.',
              'The Progress panel keeps a page-visit <strong>Wrong Bank</strong>. <strong>Highest-Priority Review</strong> is now a dropdown inside that same Progress box, so long-term Adaptive review suggestions stay available without occupying a separate sidebar panel.',
          )

          # Permanent maintenance documentation for the new structure.
          replace_once(
              'AGENTS.md',
              '- Greek has top-level quick selectors for All Vocabulary and All Endings; narrower lesson selectors remain independently adjustable. Main Greek/Latin Forward/Reverse direction lives inside Choose cards, not in the flashcard toolbar.',
              '- Greek has top-level quick selectors for All Lesson Vocabulary and All Endings; narrower lesson selectors remain independently adjustable. New Testament Vocab (Kubo) is a separate top-level vocabulary family immediately after Quick select and is not folded into All Lesson Vocabulary. Main Greek/Latin Forward/Reverse direction lives inside Choose cards, not in the flashcard toolbar.',
          )
          replace_once(
              'AGENTS.md',
              '- Current Greek vocabulary sources are Lessons 3–10 Vocabulary. Lessons 3–10 expose Vocabulary and Endings in the active menu; paradigm source cards are not exposed there. Each lesson Vocabulary heading is already its all-vocabulary selector and exposes exact word checkboxes immediately beneath it; do not add a redundant “Vocabulary words” or “All Lesson N vocabulary” layer.',
              '- Current Greek vocabulary sources are Lessons 3–10 Vocabulary plus the separate New Testament Vocab (Kubo) deck. Lessons 3–10 expose Vocabulary and Endings in the active menu; paradigm source cards are not exposed there. Each lesson Vocabulary heading is already its all-vocabulary selector and exposes exact word checkboxes immediately beneath it; do not add a redundant “Vocabulary words” or “All Lesson N vocabulary” layer. Kubo stays separate, frequency-ranked, and grouped by occurrence bands.',
          )
          replace_once(
              'AGENTS.md',
              '- The timer toolbar visibly labels `Z` as the Pause shortcut.',
              '- The timer sits at the far right of the shared Greek/Latin study toolbar and visibly labels `Z` as the Pause shortcut.',
          )
          replace_once(
              'AGENTS.md',
              '- Highest-Priority Review remains long-term/adaptive and may use the user\'s continuous learning history for scoring, but its candidate list MUST be limited to the currently selected/available card pool.',
              '- Highest-Priority Review is a collapsible dropdown inside the main Progress sidebar box. It remains long-term/adaptive and may use the user\'s continuous learning history for scoring, but its candidate list MUST be limited to the currently selected/available card pool.',
          )

          replace_once(
              '.github/copilot-instructions.md',
              'Each lesson Vocabulary heading is already the all-vocabulary selector, with **Vocabulary words** beneath it for exact cards; do not add a redundant “All Lesson N vocabulary” child row.',
              'Each lesson Vocabulary heading is already the all-vocabulary selector, with exact word checkboxes immediately beneath it; do not add a redundant “Vocabulary words” or “All Lesson N vocabulary” child row.',
          )
          replace_once(
              '.github/copilot-instructions.md',
              '- Card order exposes **Adaptive**, **Sequential**, and **Shuffle** in the shared study controller.',
              '- Card order exposes **Adaptive**, **Sequential**, and **Shuffle** in the shared study controller. The response timer is the far-right toolbar control on desktop and remains last/right-aligned on responsive layouts; its visible **Z Pause** cue stays attached to the timer.',
          )
          replace_once(
              '.github/copilot-instructions.md',
              'Greek may list exact cards directly under source/deck disclosures.',
              'Greek may list exact cards directly under source/deck disclosures. Keep **New Testament Vocab (Kubo)** as a separate top-level family immediately after Quick select, with its frequency-band parents and exact words; **All Lesson Vocabulary** must not silently select the Kubo deck.',
          )

          replace_once(
              'docs/MAINTENANCE.md',
              '- `src/features/study/study-session-ui.tsx` — shared card faces, grading controls, Start gate, Enter/F interaction, sidebar.',
              '- `src/features/study/study-session-ui.tsx` — shared card faces, grading controls, Start gate, Enter/F interaction, toolbar layout, and sidebar. The timer is the far-right toolbar control, and Highest-Priority Review is a dropdown inside the Progress panel.',
          )
          replace_once(
              'docs/MAINTENANCE.md',
              '- `public/data/greek-lesson3-grammar.json`\n',
              '- `public/data/greek-lesson3-grammar.json`\n- `src/data/greek-new-testament-vocab.ts` plus `public/data/greek-new-testament-vocab-*.json` — Kubo general NT vocabulary (>50 occurrences), separate from lesson vocabulary.\n',
          )

          # Add regression expectations for the requested visible layout.
          p = Path('tests/how-site-works.test.ts')
          text = p.read_text()
          needle = '    expect(guide).toContain("Session score is now accuracy only");\n'
          addition = '    expect(guide).toContain("New Testament Vocab (Kubo)");\n    expect(guide).toContain("far right of the main Greek/Latin toolbar");\n    expect(guide).toContain("Highest-Priority Review</strong> is now a dropdown inside that same Progress box");\n'
          if addition.strip() not in text:
              if needle not in text:
                  raise SystemExit('How-site-works test anchor not found')
              text = text.replace(needle, needle + addition, 1)
          p.write_text(text)

          p = Path('tests/greek-new-testament-vocab.test.ts')
          text = p.read_text()
          if 'New Testament Vocab (Kubo)' not in text:
              text += '''\n\ndescribe("Greek Kubo selector wiring", () => {\n  it("keeps Kubo separate from All Lesson Vocabulary and prominent in Choose cards", () => {\n    const page = fs.readFileSync("src/pages/greek-page-v2.tsx", "utf8");\n    expect(page).toContain('label="All Lesson Vocabulary"');\n    expect(page).toContain('title="New Testament Vocab (Kubo)"');\n    expect(page.indexOf('title="New Testament Vocab (Kubo)"')).toBeLessThan(page.indexOf('title="Lesson 1"'));\n    expect(page).toContain('const allVocabularyKeys: string[] = [...lessonVocabularyKeys];');\n  });\n});\n'''
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify repository
        run: npm run check
      - name: Commit refinements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/study/study-session-ui.tsx src/pages/greek-page-v2.tsx src/pages/how-site-works.tsx AGENTS.md docs/MAINTENANCE.md .github/copilot-instructions.md tests/how-site-works.test.ts tests/greek-new-testament-vocab.test.ts
          git commit -m "Refine study toolbar and sidebar UI"
          git push origin HEAD:feature/sidebar-toolbar-polish
