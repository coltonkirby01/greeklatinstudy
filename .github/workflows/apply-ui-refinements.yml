name: Apply UI refinements
on:
  push:
    branches:
      - feature/sidebar-toolbar-polish
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sidebar-toolbar-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep priority review inside Progress
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("src/features/study/study-session-ui.tsx")
          text = p.read_text()
          old = '''      </details>
    </section>
      <details className="priority-details">
        <summary><span>Highest-Priority Review</span>'''
          new = '''      </details>
      <details className="priority-details">
        <summary><span>Highest-Priority Review</span>'''
          if old in text:
              text = text.replace(old, new, 1)
          tail_old = '''        <p className="source-note">Answers remain hidden. Only the currently selected cards can appear here; their correctness, difficulty, recall time, recency, strength, and due dates affect priority.</p>
      </details>
  </aside>;'''
          tail_new = '''        <p className="source-note">Answers remain hidden. Only the currently selected cards can appear here; their correctness, difficulty, recall time, recency, strength, and due dates affect priority.</p>
      </details>
    </section>
  </aside>;'''
          if tail_old in text:
              text = text.replace(tail_old, tail_new, 1)
          if text.index('className="priority-details"') > text.index('</section>', text.index('className="stats-panel"')):
              raise SystemExit("Priority dropdown is still outside Progress panel")
          p.write_text(text)

          t = Path("tests/study-ux-request.test.ts")
          tests = t.read_text()
          needle = '    expect(sidebar).toContain("Flash These");\n'
          addition = '    expect(sidebar).toContain(\'className="priority-details"\');\n    expect(sidebar.indexOf(\'className="priority-details"\')).toBeLessThan(sidebar.indexOf("</section>", sidebar.indexOf(\'className="stats-panel"\')));\n'
          if addition.strip() not in tests:
              tests = tests.replace(needle, needle + addition, 1)
              t.write_text(tests)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify repository
        run: npm run check
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo no-source-changes
          else
            git config user.name github-actions-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/features/study/study-session-ui.tsx tests/study-ux-request.test.ts
            git commit -m "Integrate priority review into Progress panel"
            git push origin HEAD:feature/sidebar-toolbar-polish
          fi
