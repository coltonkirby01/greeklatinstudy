name: Apply New Testament vocabulary integration v5

on:
  push:
    branches: [feature/new-testament-vocab]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-testament-vocab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integration
        run: python scripts/apply-new-testament-vocab.py
      - name: Install dependencies
        run: npm ci
      - name: Verify and capture diagnostics
        shell: bash
        run: |
          set +e
          : > nt-vocab-diagnostics.txt
          echo '=== maintain ===' >> nt-vocab-diagnostics.txt
          npm run maintain:check >> nt-vocab-diagnostics.txt 2>&1
          echo "maintain_exit=$?" >> nt-vocab-diagnostics.txt
          echo '=== tests ===' >> nt-vocab-diagnostics.txt
          npm test >> nt-vocab-diagnostics.txt 2>&1
          echo "tests_exit=$?" >> nt-vocab-diagnostics.txt
          echo '=== build ===' >> nt-vocab-diagnostics.txt
          npm run build:pages >> nt-vocab-diagnostics.txt 2>&1
          echo "build_exit=$?" >> nt-vocab-diagnostics.txt
      - name: Commit integration and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose New Testament vocabulary integration"
          git push origin HEAD:feature/new-testament-vocab
