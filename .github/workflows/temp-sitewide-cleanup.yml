  { id: "greek-i", language: "Greek", source: "Lessons 1–2", load: loadGreekDeck, modes: [{ mode: "Forward", direction: "forward", studyKey: "forward" }, { mode: "Reverse", direction: "reverse", studyKey: "reverse" }] },
