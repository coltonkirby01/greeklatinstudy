name: Temporary sitewide cleanup

on:
  push:
    branches: [chatgpt/sitewide-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Apply sitewide cleanup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sitewide-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safe cleanup and UX changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def text(path):
              return (root / path).read_text()

          def write(path, value):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(value)

          def replace(path, old, new, count=None):
              value = text(path)
              found = value.count(old)
              if found == 0:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {found}: {old[:100]!r}')
              write(path, value.replace(old, new))

          def sub(path, pattern, repl, count=0, flags=0):
              value = text(path)
              next_value, changed = re.subn(pattern, repl, value, count=count, flags=flags)
              if changed == 0:
                  raise SystemExit(f'Pattern not found in {path}: {pattern[:100]!r}')
              write(path, next_value)

          def remove(path):
              p = root / path
              if p.exists():
                  p.unlink()

