name: Greek audio diagnostic audition

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/greek-audio-diagnostic.yml

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate eight diagnostic new-vocabulary recordings
        env:
          SUPABASE_URL: https://wqgvpgmudouftyhnvvpr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_s4DGueytgij3zvSce1D1hQ_jtEf1X1e
        shell: bash
        run: |
          set -euo pipefail
          payload='{"assetIds":["lesson6-v6","lesson10-v3","lesson11-v1","lesson11-v8","lesson11-v10","lesson12-v1","lesson12-v2","lesson12-v7"]}'
          status=$(curl --silent --show-error --output /tmp/course-audio-response.json --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/functions/v1/course-audio" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload")
          cat /tmp/course-audio-response.json
          echo
          if [[ "$status" != "200" ]]; then
            echo "Diagnostic Greek audio generation failed with HTTP $status" >&2
            exit 1
          fi
