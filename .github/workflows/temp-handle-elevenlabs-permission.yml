name: Handle restricted ElevenLabs usage permission
on:
  push:
    branches: [chatgpt/elevenlabs-usage-panel]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/elevenlabs-usage-panel
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/elevenlabs-usage/index.ts')
          s = p.read_text()
          old = '''async function loadUsage(apiKey: string) {
  const response = await fetch("https://api.elevenlabs.io/v1/user/subscription", {
    headers: { "xi-api-key": apiKey, Accept: "application/json" },
  });
  if (!response.ok) throw new Error(`ElevenLabs subscription lookup failed: ${response.status} ${await response.text()}`);
  return normalizeUsage(await response.json() as Subscription);
}
'''
          new = '''class ElevenLabsLookupError extends Error {
  constructor(public code: string, message: string) { super(message); }
}

async function loadUsage(apiKey: string) {
  const response = await fetch("https://api.elevenlabs.io/v1/user/subscription", {
    headers: { "xi-api-key": apiKey, Accept: "application/json" },
  });
  if (!response.ok) {
    const detail = await response.text();
    if (response.status === 401 && /user_read|missing_permissions/i.test(detail)) {
      throw new ElevenLabsLookupError(
        "missing_user_read",
        "The ElevenLabs API key can generate speech but cannot read subscription usage. In ElevenLabs, open Developers → API Keys → More Actions (…) → Edit, then enable User: Read for this key.",
      );
    }
    throw new Error(`ElevenLabs subscription lookup failed: ${response.status} ${detail}`);
  }
  return normalizeUsage(await response.json() as Subscription);
}
'''
          if s.count(old) != 1:
              raise SystemExit('loadUsage anchor missing')
          s = s.replace(old, new, 1)
          old_catch = '''  } catch (error) {
    return json({ error: error instanceof Error ? error.message : String(error) }, 502);
  }
});
'''
          new_catch = '''  } catch (error) {
    if (error instanceof ElevenLabsLookupError) return json({ ok: false, code: error.code, error: error.message });
    return json({ error: error instanceof Error ? error.message : String(error) }, 502);
  }
});
'''
          if s.count(old_catch) != 1:
              raise SystemExit('catch anchor missing')
          p.write_text(s.replace(old_catch, new_catch, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/elevenlabs-usage/index.ts
          git diff --cached --check
          git commit -m "Explain missing ElevenLabs usage permission"
          git push origin HEAD:chatgpt/elevenlabs-usage-panel
