name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Keep live main deployments independent from pull-request checks so
  # frontend work cannot cancel the production Pages deployment.
  group: pages-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
      - name: Check repository maintenance invariants
        run: npm run maintain:check
      - run: npm test
      - run: npm run build:pages
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.initial-deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Deploy tested artifact immediately
        id: initial-deployment
        uses: actions/deploy-pages@v4

      - name: Wait for any legacy Pages deployment
        id: legacy-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This repository is still configured to receive GitHub's legacy
          # branch/Jekyll Pages job. Keep the tested Vite site live while that
          # job runs, then restore this same tested artifact immediately after
          # legacy finishes so legacy can never remain the final deployment.
          legacy_seen=false
          for attempt in {1..600}; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")][0].status // "missing"')
            if [ "$status" = "missing" ]; then
              echo "Legacy Pages workflow is not enabled for this commit."
              echo "redeploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            legacy_seen=true
            if [ "$status" = "completed" ]; then
              echo "redeploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          if [ "$legacy_seen" = "true" ]; then
            echo "Legacy Pages deployment did not finish within 10 minutes." >&2
            exit 1
          fi
          echo "redeploy=false" >> "$GITHUB_OUTPUT"

      - name: Restore tested artifact after legacy Pages
        if: steps.legacy-pages.outputs.redeploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
