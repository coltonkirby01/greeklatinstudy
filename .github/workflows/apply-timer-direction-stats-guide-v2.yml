name: Apply timer direction stats guide updates v2

on:
  push:
    branches:
      - feature/timer-direction-stats-guide

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timer-direction-stats-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply requested changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {text.count(old)} for {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def insert_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text()
              if addition.strip() in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {text.count(anchor)} for {anchor[:120]!r}")
              p.write_text(text.replace(anchor, anchor + addition, 1))

          # ---- Shared keyboard behavior ----
          replace_once(
              "src/features/study/study-shortcuts.ts",
              '  | { type: "save" }\n  | null;',
              '  | { type: "save" }\n  | { type: "pause" }\n  | null;',
          )
          replace_once(
              "src/features/study/study-shortcuts.ts",
              '''export function studyShortcut({ key, startGateOpen, revealed, typingTarget, controlsTarget = false }: ShortcutContext): StudyShortcut {\n  const isSpace = key === " " || key === "Spacebar";\n\n  // Genuine text-entry fields keep normal typing behavior. Toolbar selects are\n  // also classified as typing targets by the controllers, but Space must still\n  // belong to the flashcard session after Adaptive/Sequential or Learner/Reviewer\n  // has been clicked. controlsTarget distinguishes those toolbar controls.\n  if (typingTarget && !(isSpace && controlsTarget)) return null;''',
              '''export function studyShortcut({ key, startGateOpen, revealed, typingTarget, controlsTarget = false }: ShortcutContext): StudyShortcut {\n  const isSpace = key === " " || key === "Spacebar";\n  const normalized = key.toLowerCase();\n  const isPause = normalized === "z" && !startGateOpen && !revealed;\n\n  // Genuine text-entry fields keep normal typing behavior. Toolbar selects are\n  // also classified as typing targets by the controllers, but Space and the\n  // question-side Z pause shortcut still belong to the flashcard session when\n  // a toolbar control has focus.\n  if (typingTarget && !(isSpace && controlsTarget) && !(isPause && controlsTarget)) return null;''',
          )
          replace_once(
              "src/features/study/study-shortcuts.ts",
              '''  // While the start gate is open, no other key may dismiss it. The user must\n  // click the on-screen Start control or press Space.\n  if (startGateOpen) return null;\n\n  // Non-Space shortcuts do not override toolbar/start-card controls.\n  if (controlsTarget) return null;\n  if (!revealed) return null;\n\n  const normalized = key.toLowerCase();\n  if (normalized === "f") return { type: "flip" };''',
              '''  // While the start gate is open, no other key may dismiss it. The user must\n  // click the on-screen Start control or press Space.\n  if (startGateOpen) return null;\n\n  // Z is the dedicated question-side timer stop key. It reopens the Start gate\n  // without revealing, grading, or advancing the card.\n  if (isPause) return { type: "pause" };\n\n  // Other non-Space shortcuts do not override toolbar/start-card controls.\n  if (controlsTarget) return null;\n  if (!revealed) return null;\n\n  if (normalized === "f") return { type: "flip" };''',
          )

          # ---- Primary Greek/Latin controller ----
          p = "src/features/study/multi-source-study-session.tsx"
          replace_once(p, 'const PropsDefaults = { forward: "Forward", reverse: "Reverse" } as const;\n\n', '')
          replace_once(p, '''  direction: StudyDirection;\n  onDirectionChange?: (direction: StudyDirection) => void;\n  directionLabels?: { forward: string; reverse: string };\n  resetKey: string;''', '''  direction: StudyDirection;\n  resetKey: string;''')
          replace_once(p, 'export function MultiSourceStudySession({ deck, sources, direction, onDirectionChange, directionLabels = PropsDefaults, resetKey, resumeSession, renderFront, renderBack, priorityPrompt, savedCardRefs, onToggleSavedCard, onDeselectCard }: Props) {', 'export function MultiSourceStudySession({ deck, sources, direction, resetKey, resumeSession, renderFront, renderBack, priorityPrompt, savedCardRefs, onToggleSavedCard, onDeselectCard }: Props) {')
          replace_once(p, '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const visitStartedAtRef = useRef(Date.now());', '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const clickPausedTimerRef = useRef(false);\n  const visitStartedAtRef = useRef(Date.now());')
          replace_once(p, '    if (!current || revealed || editingTransaction || startGateOpen || wrongBankComplete) return;', '    if (clickPausedTimerRef.current || !current || revealed || editingTransaction || startGateOpen || wrongBankComplete) return;')
          replace_once(p, '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction && !wrongBankComplete) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed, wrongBankComplete]);\n''', '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction && !wrongBankComplete) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed, wrongBankComplete]);\n\n  useEffect(() => {\n    function pauseForPageClick() {\n      if (revealed || editingTransaction || startGateOpen || wrongBankComplete) return;\n      clickPausedTimerRef.current = true;\n      setStartGateOpen(true);\n      queueMicrotask(() => { clickPausedTimerRef.current = false; });\n    }\n    document.addEventListener("click", pauseForPageClick, true);\n    return () => document.removeEventListener("click", pauseForPageClick, true);\n  }, [editingTransaction, revealed, startGateOpen, wrongBankComplete]);\n''')
          replace_once(p, '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }', '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "pause") { event.preventDefault(); setStartGateOpen(true); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }')
          replace_once(p, '            {onDirectionChange && <div className="segmented-control" aria-label="Study direction">{(["forward", "reverse"] as StudyDirection[]).map((value) => <button key={value} type="button" aria-pressed={direction === value} disabled={Boolean(wrongBankRun)} onClick={() => onDirectionChange(value)}>{directionLabels[value]}</button>)}</div>}\n', '')
          order_select = '            <label className="compact-select-label"><span className="sr-only">Card order</span><select value={selectionMode} disabled={Boolean(wrongBankRun)} onChange={(event) => changeOrder(event.target.value as SelectionMode)}><option value="adaptive">Adaptive</option><option value="sequential">Sequential</option><option value="shuffle">Shuffle</option></select></label>'
          timer_first = '''            <div className="toolbar-timer" aria-label={`Front-card response time ${displayedTimer} seconds`}>\n              <span className="toolbar-timer-value">{displayedTimer}</span>\n              <button type="button" className="toolbar-timer-toggle" data-study-control="timer" onClick={() => setStartGateOpen(startGateOpen ? false : true)} disabled={timerToggleDisabled} aria-label={startGateOpen ? "Play timer" : "Pause timer"} title={startGateOpen ? "Play timer" : "Pause timer"}>{startGateOpen ? <Play aria-hidden="true" /> : <Pause aria-hidden="true" />}</button>\n            </div>\n''' + order_select
          replace_once(p, order_select, timer_first)
          replace_once(p, '<option value={1}>Adapt 1 · Light</option><option value={2}>Adapt 2 · Standard</option><option value={3}>Adapt 3 · Intensive</option>', '<option value={1}>1: Diverse</option><option value={2}>2: Standard</option><option value={3}>3: Concentrated</option>')
          old_timer = '''            <div className="toolbar-timer" aria-label={`Front-card response time ${displayedTimer} seconds`}>\n              <span className="toolbar-timer-value">{displayedTimer}</span>\n              <button type="button" className="toolbar-timer-toggle" data-study-control="timer" onClick={() => setStartGateOpen((open) => !open)} disabled={timerToggleDisabled} aria-label={startGateOpen ? "Play timer" : "Pause timer"} title={startGateOpen ? "Play timer" : "Pause timer"}>{startGateOpen ? <Play aria-hidden="true" /> : <Pause aria-hidden="true" />}</button>\n            </div>\n'''
          replace_once(p, old_timer, '')

          # ---- Generic/imported deck controller: same pause safety ----
          p = "src/features/study/study-session.tsx"
          replace_once(p, '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const [selectionMode, setSelectionMode] = useState<SelectionMode>("adaptive");', '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const clickPausedTimerRef = useRef(false);\n  const [selectionMode, setSelectionMode] = useState<SelectionMode>("adaptive");')
          replace_once(p, '    if (!current || revealed || editingTransaction || startGateOpen) return;', '    if (clickPausedTimerRef.current || !current || revealed || editingTransaction || startGateOpen) return;')
          replace_once(p, '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed]);\n''', '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed]);\n\n  useEffect(() => {\n    function pauseForPageClick() {\n      if (revealed || editingTransaction || startGateOpen) return;\n      clickPausedTimerRef.current = true;\n      setStartGateOpen(true);\n      queueMicrotask(() => { clickPausedTimerRef.current = false; });\n    }\n    document.addEventListener("click", pauseForPageClick, true);\n    return () => document.removeEventListener("click", pauseForPageClick, true);\n  }, [editingTransaction, revealed, startGateOpen]);\n''')
          replace_once(p, '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }', '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "pause") { event.preventDefault(); setStartGateOpen(true); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }')

          # ---- Direction selector moves into Choose cards ----
          p = "src/features/study/study-filter-menu.tsx"
          replace_once(p, 'import type { StudyCard } from "./types";', 'import type { StudyCard, StudyDirection } from "./types";')
          insert_after(p, 'const savedCardsHint = "Cards you save with the card button or S shortcut are private to your account or this guest browser.";\n', '''\nexport function FilterDirectionControl({ direction, onChange, labels = { forward: "Forward", reverse: "Reverse" } }: { direction: StudyDirection; onChange: (direction: StudyDirection) => void; labels?: { forward: string; reverse: string } }) {\n  return <div className="segmented-control filter-direction-control" aria-label="Study direction">\n    {(["forward", "reverse"] as StudyDirection[]).map((value) => <button key={value} type="button" aria-pressed={direction === value} onClick={() => onChange(value)}>{labels[value]}</button>)}\n  </div>;\n}\n''')
          insert_after("src/features/study/study-filter-menu.css", '.filter-option-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 0.4rem;\n}\n', '\n.filter-direction-control { width: min(100%, 22rem); }\n.filter-direction-control button { flex: 1 1 0; }\n')

          p = "src/pages/greek-page-v2.tsx"
          replace_once(p, 'import { ExactCardSelection, FilterCheckbox, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";', 'import { ExactCardSelection, FilterCheckbox, FilterDirectionControl, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";')
          replace_once(p, '    {decks && <StudyFilterMenu summary={`${selectedCards.length} cards in the current pool`}>\n      <FilterSection title="Quick select"', '    {decks && <StudyFilterMenu summary={`${selectedCards.length} cards in the current pool`}>\n      <FilterSection title="Study direction" description="Forward and Reverse keep separate review histories, mastery, timing, and scheduling.">\n        <FilterDirectionControl direction={direction} onChange={setDirection} />\n      </FilterSection>\n      <FilterSection title="Quick select"')
          replace_once(p, '            <FilterCheckbox label={`All Lesson ${config.lesson} vocabulary`} count={vocabularyDeck.cards.length} checked={vocabularySelection.checked} mixed={vocabularySelection.mixed} onChange={(checked) => changeGroups([config.vocabularyKey], checked)} />\n', '')
          replace_once(p, '      onDirectionChange={setDirection}\n      directionLabels={{ forward: "Forward", reverse: "Reverse" }}\n', '')

          p = "src/pages/latin-page.tsx"
          replace_once(p, 'import { ExactCardSelection, FilterCheckbox, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";', 'import { ExactCardSelection, FilterCheckbox, FilterDirectionControl, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";')
          replace_once(p, '''      >\n        <FilterSection title="Quick select" description="Cards you save with the card button or S shortcut are private to your account or this guest browser." onAll={selectAllCards} onNone={deselectAllCards}>''', '''      >\n        <FilterSection title="Study direction" description="Forward and Reverse keep separate review histories, mastery, timing, and scheduling.">\n          <FilterDirectionControl direction={direction} onChange={setDirection} />\n        </FilterSection>\n        <FilterSection title="Quick select" description="Cards you save with the card button or S shortcut are private to your account or this guest browser." onAll={selectAllCards} onNone={deselectAllCards}>''')
          replace_once(p, '          onDirectionChange={setDirection}\n          directionLabels={{ forward: "Forward", reverse: "Reverse" }}\n', '')

          replace_once("src/features/study/study-session-ui.tsx", '<p>Choose direction or card order above while paused, then begin when ready.</p>', '<p>Choose card order above or study direction inside Choose cards while paused, then begin when ready.</p>')

          # ---- Stats: session score = accuracy only ----
          replace_once("src/features/study/scoring.ts", '''export function scoredSession(reviews: ScoredReview[]) {\n  if (!reviews.length) return 0;\n  const accuracy = reviews.filter((review) => review.result === "right").length / reviews.length;\n  let speed = 0, challenge = 0, streak = 0, bestStreak = 0;\n  for (const review of reviews) {\n    speed += recallSpeedScore(review.responseTimeMs, review.intrinsicDifficulty); challenge += review.intrinsicDifficulty / 100;\n    if (review.result === "right") { streak += 1; bestStreak = Math.max(bestStreak, streak); } else streak = 0;\n  }\n  speed /= reviews.length; challenge /= reviews.length;\n  const performance = accuracy * 0.55 + speed * 0.25 + Math.min(1, bestStreak / 10) * 0.20;\n  return Number(clamp(performance * (0.72 + challenge * 0.28) * 100).toFixed(1));\n}''', '''export function scoredSession(reviews: ScoredReview[]) {\n  if (!reviews.length) return 0;\n  const accuracy = reviews.filter((review) => review.result === "right").length / reviews.length;\n  return Number((accuracy * 100).toFixed(1));\n}''')

          p = "src/pages/stats-page.tsx"
          replace_once(p, '    score.push({ label: weekFormatter.format(week), value: items.reduce((sum, item) => sum + item.score, 0) / items.length });', '    const right = items.reduce((sum, item) => sum + item.right, 0);\n    score.push({ label: weekFormatter.format(week), value: reviews ? right / reviews * 100 : 0 });')
          replace_once(p, '<small>{dateTime(session.startedAt)} · {session.reviews} reviews · score {session.score.toFixed(1)}{session.inferred ? " · imported legacy history" : ""}</small>', '<small>{dateTime(session.startedAt)} · {session.reviews} reviews · score {session.score.toFixed(1)}%{session.inferred ? " · imported legacy history" : ""}</small>')
          replace_once(p, '<TrendChart title="Session score by week" subtitle="Average ranked-session score" points={trends.score} format={(value) => value.toFixed(1)} />', '<TrendChart title="Session score by week" subtitle="Overall accuracy of the selected session reviews" points={trends.score} format={(value) => `${value.toFixed(1)}%`} />')
          replace_once(p, '<div className="stats-section-heading"><div><p className="eyebrow">Session analysis</p><h3>Session rankings</h3><p>Learner and Reviewer are permanent session types. Custom sessions can be continued, renamed, or deleted while adaptive learning memory remains intact.</p></div><TrendingUp aria-hidden="true" /></div>', '<div className="stats-section-heading"><div><p className="eyebrow">Session analysis</p><h3>Session rankings</h3><p>Session score is simply overall accuracy: percent of saved reviews answered Right. Speed and card difficulty remain visible statistics but do not change the session score.</p></div><TrendingUp aria-hidden="true" /></div>')
          replace_once(p, '<td><strong>{session.score.toFixed(1)}</strong></td><td>{session.changeFromPrevious === null ? "—" : `${session.changeFromPrevious >= 0 ? "+" : ""}${session.changeFromPrevious.toFixed(1)}`}</td>', '<td><strong>{session.score.toFixed(1)}%</strong></td><td>{session.changeFromPrevious === null ? "—" : `${session.changeFromPrevious >= 0 ? "+" : ""}${session.changeFromPrevious.toFixed(1)} pp`}</td>')

          # ---- Learner-facing How this site works ----
          p = "src/pages/how-site-works.tsx"
          replace_once(p, 'import "./how-site-works.css";', 'import { ADAPTIVE_PROFILES } from "../features/study/adaptive-settings";\nimport "./how-site-works.css";')
          replace_once(p, 'const coveragePercent = Math.round(INITIAL_COVERAGE_MULTIPLIER * 100);', 'const coveragePercent = Math.round(INITIAL_COVERAGE_MULTIPLIER * 100);\nconst diverseCoveragePercent = Math.round(ADAPTIVE_PROFILES[1].coverageMultiplier * 100);\nconst concentratedCoveragePercent = Math.round(ADAPTIVE_PROFILES[3].coverageMultiplier * 100);')
          replace_once(p, '''            <h3>Adaptive</h3>\n            <p>Adaptive study gives more attention to cards that need it. Priority is influenced by past Right/Wrong results, Easy/Medium/Hard ratings, response time, recency, current strength, whether a card is due, and whether it has been learned correctly before. Recent cards are also discouraged from repeating immediately when the pool is large enough.</p>\n            <h3>Initial coverage</h3>\n            <p>At the beginning of an Adaptive session, difficult cards may repeat, but they cannot crowd out new cards indefinitely. Every currently selected and unlocked card must be seen during the initial pass by no later than {coveragePercent}% of that pool's size, rounded up. For example, 20 selected cards must all appear by card 25. Once every selected card has appeared at least once, this coverage constraint ends and the normal Adaptive algorithm takes over.</p>''', '''            <h3>Adaptive</h3>\n            <p>Adaptive study gives more attention to cards that need it. Priority is influenced by past Right/Wrong results, Easy/Medium/Hard ratings, response time, recency, current strength, whether a card is due, and whether it has been learned correctly before. The repetition control has three levels: <strong>1: Diverse</strong> favors breadth and fewer immediate repeats; <strong>2: Standard</strong> balances breadth and review; <strong>3: Concentrated</strong> focuses more aggressively on recently Wrong or Hard cards.</p>\n            <h3>Initial coverage</h3>\n            <p>Difficult cards may repeat during initial coverage, but they cannot crowd out unseen cards indefinitely. In the main Greek and Latin apps, Diverse forces complete first coverage by about {diverseCoveragePercent}% of the selected pool, Standard by {coveragePercent}%, and Concentrated by about {concentratedCoveragePercent}%, each rounded up. For example, with Standard and 20 selected cards, all 20 must appear by card 25. Once every selected card has appeared, normal Adaptive selection takes over.</p>\n            <p>The Progress panel's <strong>Words/forms left</strong> dropdown lists selected cards not yet seen during the current page visit. Clicking one queues that word or form to be shown next without changing its long-term history.</p>''')
          replace_once(p, '''        <details className="site-guide-section">\n          <summary>Automatic grade suggestions</summary>''', '''        <details className="site-guide-section">\n          <summary>Wrong Bank and page-visit review tools</summary>\n          <div>\n            <p>The Progress panel keeps a page-visit <strong>Wrong Bank</strong>. A card enters the bank when it is saved Wrong and leaves if that same review is corrected to Right with Back. The bank resets when the page is reloaded or re-entered; it does not alter permanent review history.</p>\n            <p>Open Wrong Bank to see each missed Greek or Latin form with its English answer. <strong>Flash These</strong> starts a temporary run containing only those missed cards. When the run finishes, the popup lets you repeat the same bank or return to the larger selected study pool.</p>\n          </div>\n        </details>\n\n        <details className="site-guide-section">\n          <summary>Automatic grade suggestions</summary>''')
          replace_once(p, '''            <h3>Forward and Reverse</h3>\n            <p>When a deck supports both directions, Forward and Reverse keep separate review histories, mastery, response times, and scheduling. Success in one direction does not automatically count as success in the other.</p>''', '''            <h3>Forward and Reverse</h3>\n            <p>When a deck supports both directions, Forward and Reverse keep separate review histories, mastery, response times, and scheduling. Success in one direction does not automatically count as success in the other. In the main Greek and Latin apps, the Forward/Reverse control is inside <strong>Choose cards</strong>, leaving the first toolbar position for the response timer.</p>''')
          replace_once(p, '''            <p>Every built-in card can also be selected or deselected individually in <strong>Choose cards</strong>. Greek exposes exact cards under its source groupings. Dickinson's larger vocabulary list is divided into 10-card ranges such as <strong>1–10</strong> and <strong>11–20</strong>, which open to the exact individual cards.</p>''', '''            <p>Every built-in card can also be selected or deselected individually in <strong>Choose cards</strong>. Greek Lessons 3–10 are organized around <strong>Vocabulary</strong> and <strong>Endings</strong>; the Vocabulary heading itself is the all-vocabulary control for that lesson, and its <strong>Vocabulary words</strong> dropdown exposes every word individually without a redundant second “All Lesson … vocabulary” row. Greek paradigm cards remain source data but are not exposed in the active lesson menu. Dickinson's larger Latin vocabulary list is divided into 10-card ranges such as <strong>1–10</strong> and <strong>11–20</strong>, which open to the exact individual cards.</p>''')
          replace_once(p, '''            <p>The response timer measures active time on the unrevealed question side. It pauses when the tab or window is hidden or loses focus and stops when the answer is revealed. Returning from an interruption requires the Start gate again.</p>\n            <p>The Start gate begins only when you click Start or press Space. During study, Space reveals the question and, after reveal, saves and advances. Enter toggles Right/Wrong after reveal; 1, 2, and 3 choose Easy, Medium, and Hard; F flips between question and answer. On the visible answer side, D marks or unmarks the current card for deselection on the next Save &amp; Next. S saves or unsaves a card, and A controls audio when audio is available. Text-entry fields keep normal typing behavior.</p>''', '''            <p>The response timer measures active time on the unrevealed question side and is the first control in the main Greek/Latin toolbar. It pauses when the tab or window is hidden or loses focus. While question-side timing is running, <strong>Z</strong> stops the timer and reopens the Start gate. Clicking anything on the page also pauses question-side timing and reopens the Start gate; the clicked page control can still open or change normally, but clicking the flashcard itself does not reveal it on that interrupting click. Revealing the answer stops the timer as well.</p>\n            <p>The Start gate begins only when you click Start or press Space. During study, Space reveals the question and, after reveal, saves and advances. On the unrevealed question side, plain Enter uses <strong>Back</strong> when a preceding saved grade is available; after reveal, Enter toggles Right/Wrong. Keys 1, 2, and 3 choose Easy, Medium, and Hard; F flips between question and answer. On the visible answer side, D marks or unmarks the current card for deselection on the next Save &amp; Next. S saves or unsaves a card, and A controls audio when audio is available. Text-entry fields keep normal typing behavior.</p>''')
          replace_once(p, '''            <h3>What Stats measures</h3>\n            <p>Stats includes overall, Greek, and Latin proficiency; session scores; accuracy and review volume; response time; reviewed-card difficulty; mastery; streak information; and card-level performance. It also uses session history to show changes and trends over time, helping distinguish improvement in accuracy, speed, and performance on more difficult cards.</p>''', '''            <h3>What Stats measures</h3>\n            <p>Stats includes overall, Greek, and Latin proficiency; session scores; accuracy and review volume; response time; reviewed-card difficulty; mastery; streak information; and card-level performance. <strong>Session score is now accuracy only:</strong> the percentage of saved reviews answered Right in that session. Speed and card difficulty remain visible for analysis but do not raise or lower a session score. The separate proficiency scores still use broader long-term performance evidence.</p>''')
          replace_once(p, '''            <h3>Latin</h3>\n            <p>Latin Grammar (Henle) includes active and passive indicative paradigms; adjective cards for''', '''            <h3>Latin</h3>\n            <p>Latin Grammar (Henle) includes active and passive indicative paradigms and a 20-card subjunctive set: Active and Passive Present and Imperfect remain separate by conjugation (1–4), while Active Perfect, Active Pluperfect, Passive Perfect, and Passive Pluperfect each place conjugations 1–4 together on one card. It also includes adjective cards for''')

