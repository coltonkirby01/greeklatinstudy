name: Apply timer direction stats guide updates

on:
  push:
    branches:
      - feature/timer-direction-stats-guide

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timer-direction-stats-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply requested study UX and Stats changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Shared keyboard semantics: Z pauses active question-side timing.
          rep("src/features/study/study-shortcuts.ts",
              '  | { type: "save" }\n  | null;',
              '  | { type: "save" }\n  | { type: "pause" }\n  | null;')
          rep("src/features/study/study-shortcuts.ts",
              '''  // While the start gate is open, no other key may dismiss it. The user must\n  // click the on-screen Start control or press Space.\n  if (startGateOpen) return null;\n\n  // Non-Space shortcuts do not override toolbar/start-card controls.\n  if (controlsTarget) return null;\n  if (!revealed) return null;\n\n  const normalized = key.toLowerCase();\n  if (normalized === "f") return { type: "flip" };''',
              '''  // While the start gate is open, no other key may dismiss it. The user must\n  // click the on-screen Start control or press Space.\n  if (startGateOpen) return null;\n\n  const normalized = key.toLowerCase();\n  // Z is the dedicated question-side timer stop key. It reopens the Start gate\n  // without revealing, grading, or advancing the card.\n  if (!revealed && normalized === "z") return { type: "pause" };\n\n  // Other non-Space shortcuts do not override toolbar/start-card controls.\n  if (controlsTarget) return null;\n  if (!revealed) return null;\n\n  if (normalized === "f") return { type: "flip" };''')

          # Main Greek/Latin controller: timer takes the old direction-control slot;
          # page clicks pause question timing; direction is controlled by Choose cards.
          rep("src/features/study/multi-source-study-session.tsx",
              'const PropsDefaults = { forward: "Forward", reverse: "Reverse" } as const;\n\n', '')
          rep("src/features/study/multi-source-study-session.tsx",
              '''  direction: StudyDirection;\n  onDirectionChange?: (direction: StudyDirection) => void;\n  directionLabels?: { forward: string; reverse: string };\n  resetKey: string;''',
              '''  direction: StudyDirection;\n  resetKey: string;''')
          rep("src/features/study/multi-source-study-session.tsx",
              'export function MultiSourceStudySession({ deck, sources, direction, onDirectionChange, directionLabels = PropsDefaults, resetKey, resumeSession, renderFront, renderBack, priorityPrompt, savedCardRefs, onToggleSavedCard, onDeselectCard }: Props) {',
              'export function MultiSourceStudySession({ deck, sources, direction, resetKey, resumeSession, renderFront, renderBack, priorityPrompt, savedCardRefs, onToggleSavedCard, onDeselectCard }: Props) {')
          rep("src/features/study/multi-source-study-session.tsx",
              '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const visitStartedAtRef = useRef(Date.now());',
              '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const clickPausedTimerRef = useRef(false);\n  const visitStartedAtRef = useRef(Date.now());')
          rep("src/features/study/multi-source-study-session.tsx",
              '    if (!current || revealed || editingTransaction || startGateOpen || wrongBankComplete) return;',
              '    if (clickPausedTimerRef.current || !current || revealed || editingTransaction || startGateOpen || wrongBankComplete) return;')
          rep("src/features/study/multi-source-study-session.tsx",
              '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction && !wrongBankComplete) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed, wrongBankComplete]);\n''',
              '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction && !wrongBankComplete) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed, wrongBankComplete]);\n\n  useEffect(() => {\n    function pauseForPageClick() {\n      if (revealed || editingTransaction || startGateOpen || wrongBankComplete) return;\n      clickPausedTimerRef.current = true;\n      setStartGateOpen(true);\n      queueMicrotask(() => { clickPausedTimerRef.current = false; });\n    }\n    document.addEventListener("click", pauseForPageClick, true);\n    return () => document.removeEventListener("click", pauseForPageClick, true);\n  }, [editingTransaction, revealed, startGateOpen, wrongBankComplete]);\n''')
          rep("src/features/study/multi-source-study-session.tsx",
              '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }',
              '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "pause") { event.preventDefault(); setStartGateOpen(true); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }')
          rep("src/features/study/multi-source-study-session.tsx",
              '            {onDirectionChange && <div className="segmented-control" aria-label="Study direction">{(["forward", "reverse"] as StudyDirection[]).map((value) => <button key={value} type="button" aria-pressed={direction === value} disabled={Boolean(wrongBankRun)} onClick={() => onDirectionChange(value)}>{directionLabels[value]}</button>)}</div>}\n', '')
          rep("src/features/study/multi-source-study-session.tsx",
              '            <label className="compact-select-label"><span className="sr-only">Card order</span><select value={selectionMode} disabled={Boolean(wrongBankRun)} onChange={(event) => changeOrder(event.target.value as SelectionMode)}><option value="adaptive">Adaptive</option><option value="sequential">Sequential</option><option value="shuffle">Shuffle</option></select></label>',
              '            <div className="toolbar-timer" aria-label={`Front-card response time ${displayedTimer} seconds`}>\n              <span className="toolbar-timer-value">{displayedTimer}</span>\n              <button type="button" className="toolbar-timer-toggle" data-study-control="timer" onClick={() => setStartGateOpen(startGateOpen ? false : true)} disabled={timerToggleDisabled} aria-label={startGateOpen ? "Play timer" : "Pause timer"} title={startGateOpen ? "Play timer" : "Pause timer"}>{startGateOpen ? <Play aria-hidden="true" /> : <Pause aria-hidden="true" />}</button>\n            </div>\n            <label className="compact-select-label"><span className="sr-only">Card order</span><select value={selectionMode} disabled={Boolean(wrongBankRun)} onChange={(event) => changeOrder(event.target.value as SelectionMode)}><option value="adaptive">Adaptive</option><option value="sequential">Sequential</option><option value="shuffle">Shuffle</option></select></label>')
          rep("src/features/study/multi-source-study-session.tsx",
              '<option value={1}>Adapt 1 · Light</option><option value={2}>Adapt 2 · Standard</option><option value={3}>Adapt 3 · Intensive</option>',
              '<option value={1}>1: Diverse</option><option value={2}>2: Standard</option><option value={3}>3: Concentrated</option>')
          rep("src/features/study/multi-source-study-session.tsx",
              '''            <div className="toolbar-timer" aria-label={`Front-card response time ${displayedTimer} seconds`}>\n              <span className="toolbar-timer-value">{displayedTimer}</span>\n              <button type="button" className="toolbar-timer-toggle" data-study-control="timer" onClick={() => setStartGateOpen((open) => !open)} disabled={timerToggleDisabled} aria-label={startGateOpen ? "Play timer" : "Pause timer"} title={startGateOpen ? "Play timer" : "Pause timer"}>{startGateOpen ? <Play aria-hidden="true" /> : <Pause aria-hidden="true" />}</button>\n            </div>\n''', '')

          # Older/custom deck controller gets the same Z and click-to-pause timer safety.
          rep("src/features/study/study-session.tsx",
              '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const [selectionMode, setSelectionMode] = useState<SelectionMode>("adaptive");',
              '  const shuffleCycleRef = useRef(emptyShuffleCycle());\n  const clickPausedTimerRef = useRef(false);\n  const [selectionMode, setSelectionMode] = useState<SelectionMode>("adaptive");')
          rep("src/features/study/study-session.tsx",
              '    if (!current || revealed || editingTransaction || startGateOpen) return;',
              '    if (clickPausedTimerRef.current || !current || revealed || editingTransaction || startGateOpen) return;')
          rep("src/features/study/study-session.tsx",
              '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed]);\n''',
              '''  useEffect(() => {\n    function requireRestart() { if (!revealed && !editingTransaction) setStartGateOpen(true); }\n    function visibility() { if (document.visibilityState === "hidden") requireRestart(); }\n    window.addEventListener("blur", requireRestart); document.addEventListener("visibilitychange", visibility);\n    return () => { window.removeEventListener("blur", requireRestart); document.removeEventListener("visibilitychange", visibility); };\n  }, [editingTransaction, revealed]);\n\n  useEffect(() => {\n    function pauseForPageClick() {\n      if (revealed || editingTransaction || startGateOpen) return;\n      clickPausedTimerRef.current = true;\n      setStartGateOpen(true);\n      queueMicrotask(() => { clickPausedTimerRef.current = false; });\n    }\n    document.addEventListener("click", pauseForPageClick, true);\n    return () => document.removeEventListener("click", pauseForPageClick, true);\n  }, [editingTransaction, revealed, startGateOpen]);\n''')
          rep("src/features/study/study-session.tsx",
              '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }',
              '      if (shortcut.type === "start") { event.preventDefault(); setStartGateOpen(false); return; }\n      if (shortcut.type === "pause") { event.preventDefault(); setStartGateOpen(true); return; }\n      if (shortcut.type === "reveal") { event.preventDefault(); reveal(); return; }')

          # Shared Choose cards direction control.
          rep("src/features/study/study-filter-menu.tsx",
              'import type { StudyCard } from "./types";',
              'import type { StudyCard, StudyDirection } from "./types";')
          rep("src/features/study/study-filter-menu.tsx",
              'export function FilterSection({ title, description, onAll, onNone, children }: { title: string; description?: string; onAll?: () => void; onNone?: () => void; children: ReactNode }) {',
              '''export function FilterDirectionControl({ direction, onChange, labels = { forward: "Forward", reverse: "Reverse" } }: { direction: StudyDirection; onChange: (direction: StudyDirection) => void; labels?: { forward: string; reverse: string } }) {\n  return <div className="segmented-control filter-direction-control" aria-label="Study direction">\n    {(["forward", "reverse"] as StudyDirection[]).map((value) => <button key={value} type="button" aria-pressed={direction === value} onClick={() => onChange(value)}>{labels[value]}</button>)}\n  </div>;\n}\n\nexport function FilterSection({ title, description, onAll, onNone, children }: { title: string; description?: string; onAll?: () => void; onNone?: () => void; children: ReactNode }) {''')
          rep("src/features/study/study-filter-menu.css",
              '.filter-option-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 0.4rem;\n}\n',
              '.filter-option-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 0.4rem;\n}\n\n.filter-direction-control { width: min(100%, 22rem); }\n.filter-direction-control button { flex: 1 1 0; }\n')

          # Greek: direction lives in Choose cards; eliminate redundant per-lesson all-vocabulary row.
          rep("src/pages/greek-page-v2.tsx",
              'import { ExactCardSelection, FilterCheckbox, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";',
              'import { ExactCardSelection, FilterCheckbox, FilterDirectionControl, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";')
          rep("src/pages/greek-page-v2.tsx",
              '    {decks && <StudyFilterMenu summary={`${selectedCards.length} cards in the current pool`}>\n      <FilterSection title="Quick select"',
              '    {decks && <StudyFilterMenu summary={`${selectedCards.length} cards in the current pool`}>\n      <FilterSection title="Study direction" description="Forward and Reverse keep separate review histories, mastery, timing, and scheduling.">\n        <FilterDirectionControl direction={direction} onChange={setDirection} />\n      </FilterSection>\n      <FilterSection title="Quick select"')
          rep("src/pages/greek-page-v2.tsx",
              '            <FilterCheckbox label={`All Lesson ${config.lesson} vocabulary`} count={vocabularyDeck.cards.length} checked={vocabularySelection.checked} mixed={vocabularySelection.mixed} onChange={(checked) => changeGroups([config.vocabularyKey], checked)} />\n', '')
          rep("src/pages/greek-page-v2.tsx",
              '      onDirectionChange={setDirection}\n      directionLabels={{ forward: "Forward", reverse: "Reverse" }}\n', '')

          # Latin: direction lives in Choose cards.
          rep("src/pages/latin-page.tsx",
              'import { ExactCardSelection, FilterCheckbox, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";',
              'import { ExactCardSelection, FilterCheckbox, FilterDirectionControl, FilterDisclosure, FilterSection, StudyFilterMenu } from "../features/study/study-filter-menu";')
          rep("src/pages/latin-page.tsx",
              '''      <StudyFilterMenu\n        summary={`${selectedCards.length.toLocaleString()} cards in the current pool`}\n        detail="Choose Latin vocabulary, grammar paradigms, Saved Cards, or any combination of them."\n      >\n        <FilterSection title="Quick select"''',
              '''      <StudyFilterMenu\n        summary={`${selectedCards.length.toLocaleString()} cards in the current pool`}\n        detail="Choose Latin vocabulary, grammar paradigms, Saved Cards, or any combination of them."\n      >\n        <FilterSection title="Study direction" description="Forward and Reverse keep separate review histories, mastery, timing, and scheduling.">\n          <FilterDirectionControl direction={direction} onChange={setDirection} />\n        </FilterSection>\n        <FilterSection title="Quick select"''')
          rep("src/pages/latin-page.tsx",
              '          onDirectionChange={setDirection}\n          directionLabels={{ forward: "Forward", reverse: "Reverse" }}\n', '')

          # Toolbar layout and start-gate copy now match the moved direction control.
          rep("src/features/study/study-session-ui.tsx",
              'grid-template-columns:max-content minmax(145px,.72fr) minmax(145px,.72fr) minmax(220px,1.45fr) max-content;',
              'grid-template-columns:max-content minmax(145px,.72fr) minmax(145px,.72fr) minmax(220px,1.45fr);')
          rep("src/features/study/study-session-ui.tsx",
              '<p>Choose direction or card order above while paused, then begin when ready.</p>',
              '<p>Choose card order above or study direction inside Choose cards while paused, then begin when ready.</p>')

          # Session scores are now strictly overall accuracy (percentage), not speed/difficulty weighted.
          rep("src/features/study/scoring.ts",
              '''export function scoredSession(reviews: ScoredReview[]) {\n  if (!reviews.length) return 0;\n  const accuracy = reviews.filter((review) => review.result === "right").length / reviews.length;\n  let speed = 0, challenge = 0, streak = 0, bestStreak = 0;\n  for (const review of reviews) {\n    speed += recallSpeedScore(review.responseTimeMs, review.intrinsicDifficulty); challenge += review.intrinsicDifficulty / 100;\n    if (review.result === "right") { streak += 1; bestStreak = Math.max(bestStreak, streak); } else streak = 0;\n  }\n  speed /= reviews.length; challenge /= reviews.length;\n  const performance = accuracy * 0.55 + speed * 0.25 + Math.min(1, bestStreak / 10) * 0.20;\n  return Number(clamp(performance * (0.72 + challenge * 0.28) * 100).toFixed(1));\n}''',
              '''export function scoredSession(reviews: ScoredReview[]) {\n  if (!reviews.length) return 0;\n  const accuracy = reviews.filter((review) => review.result === "right").length / reviews.length;\n  return Number((accuracy * 100).toFixed(1));\n}''')
          rep("src/pages/stats-page.tsx",
              '    score.push({ label: weekFormatter.format(week), value: items.reduce((sum, item) => sum + item.score, 0) / items.length });',
              '    const right = items.reduce((sum, item) => sum + item.right, 0);\n    score.push({ label: weekFormatter.format(week), value: reviews ? right / reviews * 100 : 0 });')
          rep("src/pages/stats-page.tsx",
              '<TrendChart title="Session score by week" subtitle="Average ranked-session score" points={trends.score} format={(value) => value.toFixed(1)} />',
              '<TrendChart title="Session score by week" subtitle="Overall accuracy of the selected session reviews" points={trends.score} format={(value) => `${value.toFixed(1)}%`} />')
          rep("src/pages/stats-page.tsx",
              '<div className="stats-section-heading"><div><p className="eyebrow">Session analysis</p><h3>Session rankings</h3><p>Learner and Reviewer are permanent session types. Custom sessions can be continued, renamed, or deleted while adaptive learning memory remains intact.</p></div><TrendingUp aria-hidden="true" /></div>',
              '<div className="stats-section-heading"><div><p className="eyebrow">Session analysis</p><h3>Session rankings</h3><p>Session score is simply overall accuracy: percent of saved reviews answered Right. Speed and card difficulty remain visible statistics but do not change the session score.</p></div><TrendingUp aria-hidden="true" /></div>')

          # Learner-facing guide: derive adaptive level coverage from the actual profiles.
          rep("src/pages/how-site-works.tsx",
              'import "./how-site-works.css";',
              'import { ADAPTIVE_PROFILES } from "../features/study/adaptive-settings";\nimport "./how-site-works.css";')
          rep("src/pages/how-site-works.tsx",
              'const coveragePercent = Math.round(INITIAL_COVERAGE_MULTIPLIER * 100);',
              'const coveragePercent = Math.round(INITIAL_COVERAGE_MULTIPLIER * 100);\nconst diverseCoveragePercent = Math.round(ADAPTIVE_PROFILES[1].coverageMultiplier * 100);\nconst concentratedCoveragePercent = Math.round(ADAPTIVE_PROFILES[3].coverageMultiplier * 100);')
          rep("src/pages/how-site-works.tsx",
              '''            <h3>Adaptive</h3>\n            <p>Adaptive study gives more attention to cards that need it. Priority is influenced by past Right/Wrong results, Easy/Medium/Hard ratings, response time, recency, current strength, whether a card is due, and whether it has been learned correctly before. Recent cards are also discouraged from repeating immediately when the pool is large enough.</p>\n            <h3>Initial coverage</h3>\n            <p>At the beginning of an Adaptive session, difficult cards may repeat, but they cannot crowd out new cards indefinitely. Every currently selected and unlocked card must be seen during the initial pass by no later than {coveragePercent}% of that pool's size, rounded up. For example, 20 selected cards must all appear by card 25. Once every selected card has appeared at least once, this coverage constraint ends and the normal Adaptive algorithm takes over.</p>''',
              '''            <h3>Adaptive</h3>\n            <p>Adaptive study gives more attention to cards that need it. Priority is influenced by past Right/Wrong results, Easy/Medium/Hard ratings, response time, recency, current strength, whether a card is due, and whether it has been learned correctly before. The repetition control has three levels: <strong>1: Diverse</strong> favors breadth and fewer immediate repeats; <strong>2: Standard</strong> balances breadth and review; <strong>3: Concentrated</strong> focuses more aggressively on recently Wrong or Hard cards.</p>\n            <h3>Initial coverage</h3>\n            <p>Difficult cards may repeat during initial coverage, but they cannot crowd out unseen cards indefinitely. In the main Greek and Latin apps, Diverse forces complete first coverage by about {diverseCoveragePercent}% of the selected pool, Standard by {coveragePercent}%, and Concentrated by about {concentratedCoveragePercent}%, each rounded up. For example, with Standard and 20 selected cards, all 20 must appear by card 25. Once every selected card has appeared, normal Adaptive selection takes over.</p>\n            <p>The Progress panel's <strong>Words/forms left</strong> dropdown lists selected cards not yet seen during the current page visit. Clicking one queues that word or form to be shown next without changing its long-term history.</p>''')
          rep("src/pages/how-site-works.tsx",
              '''        <details className="site-guide-section">\n          <summary>Automatic grade suggestions</summary>''',
              '''        <details className="site-guide-section">\n          <summary>Wrong Bank and page-visit review tools</summary>\n          <div>\n            <p>The Progress panel keeps a page-visit <strong>Wrong Bank</strong>. A card enters the bank when it is saved Wrong and leaves if that same review is corrected to Right with Back. The bank resets when the page is reloaded or re-entered; it does not alter permanent review history.</p>\n            <p>Open Wrong Bank to see each missed Greek or Latin form with its English answer. <strong>Flash These</strong> starts a temporary run containing only those missed cards. When the run finishes, the popup lets you repeat the same bank or return to the larger selected study pool.</p>\n          </div>\n        </details>\n\n        <details className="site-guide-section">\n          <summary>Automatic grade suggestions</summary>''')
          rep("src/pages/how-site-works.tsx",
              '''            <h3>Forward and Reverse</h3>\n            <p>When a deck supports both directions, Forward and Reverse keep separate review histories, mastery, response times, and scheduling. Success in one direction does not automatically count as success in the other.</p>\n            <h3>Selected cards</h3>''',
              '''            <h3>Forward and Reverse</h3>\n            <p>When a deck supports both directions, Forward and Reverse keep separate review histories, mastery, response times, and scheduling. Success in one direction does not automatically count as success in the other. In the main Greek and Latin apps, the Forward/Reverse control is inside <strong>Choose cards</strong>, leaving the first toolbar position for the response timer.</p>\n            <h3>Selected cards</h3>''')
          rep("src/pages/how-site-works.tsx",
              '''            <p>Every built-in card can also be selected or deselected individually in <strong>Choose cards</strong>. Greek exposes exact cards under its source groupings. Dickinson's larger vocabulary list is divided into 10-card ranges such as <strong>1–10</strong> and <strong>11–20</strong>, which open to the exact individual cards.</p>''',
              '''            <p>Every built-in card can also be selected or deselected individually in <strong>Choose cards</strong>. Greek Lessons 3–10 are organized around <strong>Vocabulary</strong> and <strong>Endings</strong>; the Vocabulary heading itself is the all-vocabulary control for that lesson, and its <strong>Vocabulary words</strong> dropdown exposes every word individually without a redundant second “All Lesson … vocabulary” row. Greek paradigm cards are not part of the active lesson menu. Dickinson's larger Latin vocabulary list is divided into 10-card ranges such as <strong>1–10</strong> and <strong>11–20</strong>, which open to the exact individual cards.</p>''')
          rep("src/pages/how-site-works.tsx",
              '''            <p>The response timer measures active time on the unrevealed question side. It pauses when the tab or window is hidden or loses focus and stops when the answer is revealed. Returning from an interruption requires the Start gate again.</p>\n            <p>The Start gate begins only when you click Start or press Space. During study, Space reveals the question and, after reveal, saves and advances. Enter toggles Right/Wrong after reveal; 1, 2, and 3 choose Easy, Medium, and Hard; F flips between question and answer. On the visible answer side, D marks or unmarks the current card for deselection on the next Save &amp; Next. S saves or unsaves a card, and A controls audio when audio is available. Text-entry fields keep normal typing behavior.</p>''',
              '''            <p>The response timer measures active time on the unrevealed question side and is the first control in the main Greek/Latin toolbar. It pauses when the tab or window is hidden or loses focus. While question-side timing is running, <strong>Z</strong> stops the timer and reopens the Start gate. Clicking anything on the page also pauses question-side timing and reopens the Start gate; the clicked page control can still open or change normally, but clicking the flashcard itself does not reveal it on that interrupting click. Revealing the answer stops the timer as well.</p>\n            <p>The Start gate begins only when you click Start or press Space. During study, Space reveals the question and, after reveal, saves and advances. On the unrevealed question side, plain Enter uses <strong>Back</strong> when a preceding saved grade is available; after reveal, Enter toggles Right/Wrong. Keys 1, 2, and 3 choose Easy, Medium, and Hard; F flips between question and answer. On the visible answer side, D marks or unmarks the current card for deselection on the next Save &amp; Next. S saves or unsaves a card, and A controls audio when audio is available. Text-entry fields keep normal typing behavior.</p>''')
          rep("src/pages/how-site-works.tsx",
              '''            <h3>What Stats measures</h3>\n            <p>Stats includes overall, Greek, and Latin proficiency; session scores; accuracy and review volume; response time; reviewed-card difficulty; mastery; streak information; and card-level performance. It also uses session history to show changes and trends over time, helping distinguish improvement in accuracy, speed, and performance on more difficult cards.</p>''',
              '''            <h3>What Stats measures</h3>\n            <p>Stats includes overall, Greek, and Latin proficiency; session scores; accuracy and review volume; response time; reviewed-card difficulty; mastery; streak information; and card-level performance. <strong>Session score is now accuracy only:</strong> the percentage of saved reviews answered Right in that session. Speed and card difficulty remain visible for analysis but do not raise or lower a session score. The separate proficiency scores still use broader long-term performance evidence.</p>''')
          rep("src/pages/how-site-works.tsx",
              '''            <h3>Latin</h3>\n            <p>Latin Grammar (Henle) includes active and passive indicative paradigms; adjective cards for''',
              '''            <h3>Latin</h3>\n            <p>Latin Grammar (Henle) includes active and passive indicative paradigms and a 20-card subjunctive set: Active and Passive Present and Imperfect remain separate by conjugation (1–4), while Active Perfect, Active Pluperfect, Passive Perfect, and Passive Pluperfect each place conjugations 1–4 together on one card. It also includes adjective cards for''')

          # Tests for the new behavior and labels.
