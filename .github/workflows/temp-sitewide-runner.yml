name: Temporary cleanup runner
on:
  push:
    branches:
      - chatgpt/sitewide-cleanup
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sitewide-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract and run guarded cleanup patch
        shell: bash
        run: |
          python <<'EXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/temp-sitewide-cleanup.yml').read_text()
          marker = "          python <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          script = script.replace(
              "if found == 0:\n        raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')",
              "if found == 0:\n        if path == 'src/pages/greek-page.tsx' and 'firstDeclensionEndingsAlpha' in old:\n            return\n        raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')",
          )
          # The post-fix below removes all copies and places sessionLanguage once
          # before its first use, so skip the brittle intermediate remove-one call.
          script = script.replace("replace('src/features/study/multi-source-study-session.tsx', '\\n  const sessionLanguage: \\\"Greek\\\" | \\\"Latin\\\" = deck.language === \\\"greek\\\" ? \\\"Greek\\\" : \\\"Latin\\\";\\n', '\\n', count=1)\n", "")
          Path('/tmp/sitewide_cleanup.py').write_text(script)
          EXTRACT
          python /tmp/sitewide_cleanup.py
          python <<'POSTFIX'
          from pathlib import Path
          import re

          path = Path('src/pages/greek-page.tsx')
          value = path.read_text()
          pattern = r'(        <FilterDisclosure title="Endings" summary=\{`\$\{lesson4EndingsState\.selectedCount\} of \$\{lesson4EndingsKeys\.length\} selected`\}[^\n]*>\n)(.*?)(\n        </FilterDisclosure>\n\n        <FilterDisclosure title="Paradigms")'
          body = '''          {lesson4EndingsKeys.map((key) => {
            const category = lesson4GrammarCategoryByKey.get(key)!;
            return <FilterCheckbox key={key} label={category} count={countLesson4Grammar(category)} checked={selected.has(key)} onChange={(checked) => setSelected((current) => updateSet(current, [key], checked))} />;
          })}'''
          value, changed = re.subn(pattern, lambda m: m.group(1) + body + m.group(3), value, count=1, flags=re.S)
          if changed != 1:
              raise SystemExit('Could not normalize Lesson 4 Endings children')
          path.write_text(value)

          for filename in ['src/features/study/session-management.ts', 'src/pages/stats-page.tsx']:
              p = Path(filename)
              v = p.read_text()
              v = v.replace('builtinSessionNameFromId(session.id) ?? session.name?.trim() || automaticManagedSessionName(session)', 'builtinSessionNameFromId(session.id) ?? (session.name?.trim() || automaticManagedSessionName(session))')
              v = v.replace('builtinName ?? customName || automaticSessionName(language, reviews, startedAt)', 'builtinName ?? (customName || automaticSessionName(language, reviews, startedAt))')
              p.write_text(v)

          p = Path('src/features/study/multi-source-study-session.tsx')
          v = p.read_text()
          declaration = '  const sessionLanguage: "Greek" | "Latin" = deck.language === "greek" ? "Greek" : "Latin";\n'
          v = v.replace(declaration, '')
          needle = '  const { user } = useAuth();\n'
          if needle not in v:
              raise SystemExit('Could not place sessionLanguage declaration')
          v = v.replace(needle, needle + declaration, 1)
          p.write_text(v)
          POSTFIX
          rm -f .github/workflows/temp-sitewide-cleanup.yml .github/workflows/temp-sitewide-runner.yml
      - name: Audit removed-feature references
        shell: bash
        run: |
          set -euo pipefail
          ! rg -n 'ElevenLabsUsagePanel|elevenlabs-usage|loadReadingPage|/reading|features/reading|Progress backup & migration|Portable by design|Active recall · adaptive review · reading aloud' src public README.md AGENTS.md docs supabase --glob '!supabase/migrations/0007_remove_retired_reading_and_usage.sql' --glob '!supabase/migrations/0006_elevenlabs_usage_snapshot.sql'
      - name: Install dependencies
        run: npm ci
      - name: High-severity dependency audit
        run: npm audit --audit-level=high
      - name: Tests
        run: npm test
      - name: Production Pages build
        run: npm run build:pages
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply sitewide cleanup and permanent sessions'
          git push origin HEAD:chatgpt/sitewide-cleanup
