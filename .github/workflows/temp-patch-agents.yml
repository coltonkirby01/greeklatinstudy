name: Temporary patch stale AGENTS instructions

on:
  push:
    branches: [chatgpt/maintenance-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/maintenance-hardening
      - name: Patch current behavior contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('AGENTS.md')
          s = p.read_text()
          replacements = {
            '- The primary public navigation is Home, Greek, Latin, Stats, and Reading. Stats is a first-class navigation destination, not something users should have to discover only inside a study page.': '- The primary public navigation is Home, Greek, Latin, and Stats. Stats is a first-class navigation destination, not something users should have to discover only inside a study page. Reading/Audio was deliberately removed and must not be reintroduced unless explicitly requested.',
            '- Greek Lesson 3 contains separate Vocabulary and Grammar headings. Lesson 3 Grammar currently contains exactly three whole-paradigm chart cards: Present Active Indicative, Present Active Infinitive, and Present Active Imperative from the παιδεύω paradigm.': '- Greek Lesson 3 contains separate Vocabulary, Endings, and Paradigms groupings. Lesson 3 Grammar currently contains six cards: three ending-only cards (Present Active Indicative, Infinitive, Imperative) plus three corresponding παιδεύω paradigm cards.',
            '- Each Lesson 3 grammar filter corresponds to one whole chart card, not a collection of individual person/number form cards. Do not reintroduce the retired 11 isolated Lesson 3 grammar questions unless explicitly requested.': '- The three ending cards each preserve one complete endings chart; the three paradigm cards each preserve one complete παιδεύω chart. Do not decompose them into isolated person/number questions unless explicitly requested.',
            '- Forward study asks for the named whole paradigm and reveals its chart. Reverse study shows the complete chart and asks the user to identify the paradigm; Reverse must not decompose the chart back into isolated form-identification cards.': '- Lesson 3 grammar is currently forward-only. Do not add a reverse grammar direction unless explicitly requested; vocabulary Forward/Reverse remains separate.',
            '- Correctness and difficulty remain separate recorded inputs. When an answer is revealed, correctness defaults to `Right` for every card, while difficulty is selected automatically from the captured active front-side recall time.': '- Correctness and difficulty remain separate recorded inputs. On attempts 1–3 for a card in a study mode/direction, correctness defaults to `Wrong`; from attempt 4 onward, correctness defaults to the majority result of that card\'s three most recent saved reviews. Difficulty is selected independently from captured active front-side recall time.',
            '- The timer stops when the answer is revealed; that captured value is used to choose the initial Easy/Medium/Hard difficulty. Correctness starts as Right regardless of elapsed time.': '- The timer stops when the answer is revealed; that captured value is used only to choose the initial Easy/Medium/Hard difficulty. Correctness follows the per-card rolling-review default and is independent of elapsed time.',
            '- After reveal, R = Right and W = Wrong and may override or confirm the automatic correctness selection.': '- After reveal, R and W are intentionally unassigned. Enter toggles Right/Wrong without saving.',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected AGENTS text: {old[:100]}')
              s = s.replace(old, new)
          marker = '## Built-in deck invariants\n'
          insert = '''## Weekly card additions\n\n- New cards are expected regularly. Prefer additions that change authoritative card/deck data only and automatically flow through the canonical built-in study catalog.\n- Keep all existing deck IDs and card IDs stable. Every new card must have a stable unique ID before release.\n- `src/features/study/builtin-study-catalog.ts` is the single active built-in deck/Stats/session registry. Do not create parallel Account, Stats, or session registries.\n- Adding cards to an existing registered deck must automatically reach Stats and session coverage because the catalog loads the complete deck. If a new lesson/category is introduced, extend the language selector so Select all/Deselect all and saved filter preferences handle it safely.\n- A genuinely new deck or direction must be registered in `BUILTIN_STUDY_DECKS` in the same change. Run `npm run maintain:check` and the full test/build suite before merge.\n\n'''
          if insert not in s:
              if marker not in s:
                  raise SystemExit('Built-in deck invariants marker missing')
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          rm .github/workflows/temp-patch-agents.yml
          git config user.name 'chatgpt-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add AGENTS.md .github/workflows/temp-patch-agents.yml
          git commit -m 'Patch stale AGENTS instructions'
          git push origin HEAD:chatgpt/maintenance-hardening
