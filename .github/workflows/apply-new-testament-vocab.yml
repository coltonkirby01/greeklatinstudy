name: Apply New Testament vocabulary integration

on:
  push:
    branches: [feature/new-testament-vocab]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-testament-vocab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source data and UI wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          root = Path('.')
          data_b64 = ''''''
          data_text = gzip.decompress(base64.b64decode(data_b64)).decode('utf-8')
          data_path = root / 'public/data/greek-new-testament-vocab.json'
          data_path.write_text(data_text, encoding='utf-8')
          data = json.loads(data_text)

          audio_lines = [
            'export const newTestamentVocabularyAudio: Readonly<Record<string, { label: string; greek: string }>> = {',
          ]
          for card in data:
            key = json.dumps(card['id'], ensure_ascii=False)
            greek = json.dumps(card['greek'], ensure_ascii=False)
            audio_lines.append(f'  {key}: {{ label: {greek}, greek: {greek} }},')
          audio_lines.append('};')
          (root / 'supabase/functions/course-audio/new-testament-vocabulary-assets.ts').write_text('\n'.join(audio_lines) + '\n', encoding='utf-8')

          def replace_once(path, old, new):
            p = root / path
            text = p.read_text(encoding='utf-8')
            if old not in text:
              raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
            p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Greek page: new deck, frequency groups, direct word lists, and source integration.
          replace_once('src/pages/greek-page-v2.tsx',
            '} from "../data/greek-lessons-9-10";\n',
            '} from "../data/greek-lessons-9-10";\nimport { NEW_TESTAMENT_FREQUENCY_GROUPS, loadGreekNewTestamentVocabularyDeck, type NewTestamentFrequencyGroupKey } from "../data/greek-new-testament-vocab";\n')
          replace_once('src/pages/greek-page-v2.tsx',
            'type KeyValue = (typeof keys)[keyof typeof keys];',
            'type KeyValue = (typeof keys)[keyof typeof keys] | NewTestamentFrequencyGroupKey;')
          replace_once('src/pages/greek-page-v2.tsx',
            '  lesson10Grammar: DeckDefinition;\n};',
            '  lesson10Grammar: DeckDefinition;\n  newTestamentVocabulary: DeckDefinition;\n};')
          replace_once('src/pages/greek-page-v2.tsx',
            'const allVocabularyKeys = lessonConfigs.map((config) => config.vocabularyKey);\nconst allEndingKeys = lessonConfigs.flatMap((config) => [...config.endingKeys]);\nconst allKeys: KeyValue[] = [...lesson1Keys, ...lesson2Keys, ...allVocabularyKeys, ...allEndingKeys];',
            'const lessonVocabularyKeys = lessonConfigs.map((config) => config.vocabularyKey);\nconst newTestamentFrequencyKeys = NEW_TESTAMENT_FREQUENCY_GROUPS.map((group) => group.key);\nconst allVocabularyKeys: KeyValue[] = [...lessonVocabularyKeys, ...newTestamentFrequencyKeys];\nconst allEndingKeys = lessonConfigs.flatMap((config) => [...config.endingKeys]);\nconst defaultKeys: KeyValue[] = [...lesson1Keys, ...lesson2Keys, ...lessonVocabularyKeys, ...allEndingKeys];\nconst allKeys: KeyValue[] = [...defaultKeys, ...newTestamentFrequencyKeys];')
          replace_once('src/pages/greek-page-v2.tsx',
            '    ...lessonConfigs.flatMap((config) => [decks[config.vocabularyDeck], decks[config.grammarDeck]]),\n  ];',
            '    ...lessonConfigs.flatMap((config) => [decks[config.vocabularyDeck], decks[config.grammarDeck]]),\n    decks.newTestamentVocabulary,\n  ];')
          replace_once('src/pages/greek-page-v2.tsx',
            'lesson9Vocabulary, lesson9Grammar, lesson10Vocabulary, lesson10Grammar] = await Promise.all([',
            'lesson9Vocabulary, lesson9Grammar, lesson10Vocabulary, lesson10Grammar, newTestamentVocabulary] = await Promise.all([')
          replace_once('src/pages/greek-page-v2.tsx',
            '      loadGreekLesson10VocabularyDeck(), loadGreekLesson10GrammarDeck(),\n    ]);',
            '      loadGreekLesson10VocabularyDeck(), loadGreekLesson10GrammarDeck(),\n      loadGreekNewTestamentVocabularyDeck(),\n    ]);')
          replace_once('src/pages/greek-page-v2.tsx',
            'lesson9Vocabulary, lesson9Grammar, lesson10Vocabulary, lesson10Grammar } satisfies LoadedDecks;',
            'lesson9Vocabulary, lesson9Grammar, lesson10Vocabulary, lesson10Grammar, newTestamentVocabulary } satisfies LoadedDecks;')
          replace_once('src/pages/greek-page-v2.tsx',
            'const [selected, setSelected] = useState<Set<string>>(() => loadGreekFilterSelection(allKeys));',
            'const [selected, setSelected] = useState<Set<string>>(() => loadGreekFilterSelection(defaultKeys, undefined, allKeys));')
          replace_once('src/pages/greek-page-v2.tsx',
            '    for (const config of lessonConfigs) {\n      if (sourceDeck.id === decks[config.vocabularyDeck].id) return config.vocabularyKey;',
            '    if (sourceDeck.id === decks.newTestamentVocabulary.id) {\n      const value = card.metadata?.frequencyGroupKey;\n      return typeof value === "string" && NEW_TESTAMENT_FREQUENCY_GROUPS.some((group) => group.key === value) ? value as NewTestamentFrequencyGroupKey : null;\n    }\n    for (const config of lessonConfigs) {\n      if (sourceDeck.id === decks[config.vocabularyDeck].id) return config.vocabularyKey;')

          # Remove obsolete lesson-level nested all-vocabulary helper.
          p = root / 'src/pages/greek-page-v2.tsx'
          text = p.read_text(encoding='utf-8')
          start = text.index('  function changeExactVocabularyDeck(')
          end = text.index('  function changeSavedCards(', start)
          p.write_text(text[:start] + text[end:], encoding='utf-8')

          replace_once('src/pages/greek-page-v2.tsx',
            '  }, [decks, excludedCards.refs, selected]);\n\n  const savedCardCount = useMemo(() => {',
            '  }, [decks, excludedCards.refs, selected]);\n\n  const newTestamentCards = useMemo(() => {\n    if (!decks) return [];\n    return decks.newTestamentVocabulary.cards.filter((card) => {\n      const key = card.metadata?.frequencyGroupKey;\n      return typeof key === "string" && selected.has(key) && !excludedCards.refs.has(savedCardRef(decks.newTestamentVocabulary.id, card.id));\n    });\n  }, [decks, excludedCards.refs, selected]);\n\n  const savedCardCount = useMemo(() => {')
          replace_once('src/pages/greek-page-v2.tsx',
            '    for (const { config, vocabularyDeck, grammarDeck, vocabularyCards, endingCards } of lessonCardSets) {\n      if (vocabularyCards.length) next.push({ id: `lesson${config.lesson}-vocabulary`, label: `Lesson ${config.lesson} vocabulary`, deck: vocabularyDeck, cards: vocabularyCards, studyKey: direction, direction });\n      if (endingCards.length) next.push({ id: `lesson${config.lesson}-endings`, label: `Lesson ${config.lesson} endings`, deck: grammarDeck, cards: endingCards, studyKey: "forward", direction: "forward" });\n    }\n\n    if (includeSavedCards) {',
            '    for (const { config, vocabularyDeck, grammarDeck, vocabularyCards, endingCards } of lessonCardSets) {\n      if (vocabularyCards.length) next.push({ id: `lesson${config.lesson}-vocabulary`, label: `Lesson ${config.lesson} vocabulary`, deck: vocabularyDeck, cards: vocabularyCards, studyKey: direction, direction });\n      if (endingCards.length) next.push({ id: `lesson${config.lesson}-endings`, label: `Lesson ${config.lesson} endings`, deck: grammarDeck, cards: endingCards, studyKey: "forward", direction: "forward" });\n    }\n    if (newTestamentCards.length) next.push({ id: "new-testament-vocabulary", label: "New Testament Vocab", deck: decks.newTestamentVocabulary, cards: newTestamentCards, studyKey: direction, direction });\n\n    if (includeSavedCards) {')
          replace_once('src/pages/greek-page-v2.tsx',
            '      for (const { config, vocabularyDeck, grammarDeck } of lessonCardSets) {\n        appendSaved(`saved-lesson${config.lesson}-vocabulary`, vocabularyDeck, direction, direction, () => true);\n        appendSaved(`saved-lesson${config.lesson}-endings`, grammarDeck, "forward", "forward", (card) => Boolean(keyForCategory(config.categoryByKey, card.category)));\n      }\n    }',
            '      for (const { config, vocabularyDeck, grammarDeck } of lessonCardSets) {\n        appendSaved(`saved-lesson${config.lesson}-vocabulary`, vocabularyDeck, direction, direction, () => true);\n        appendSaved(`saved-lesson${config.lesson}-endings`, grammarDeck, "forward", "forward", (card) => Boolean(keyForCategory(config.categoryByKey, card.category)));\n      }\n      appendSaved("saved-new-testament-vocabulary", decks.newTestamentVocabulary, direction, direction, () => true);\n    }')
          replace_once('src/pages/greek-page-v2.tsx',
            '  }, [decks, direction, excludedCards.refs, foundationCards, includeSavedCards, lessonCardSets, savedCards.refs]);',
            '  }, [decks, direction, excludedCards.refs, foundationCards, includeSavedCards, lessonCardSets, newTestamentCards, savedCards.refs]);')
          replace_once('src/pages/greek-page-v2.tsx',
            '  const lesson2State = groupSelectionState(lesson2Keys);\n  const countFoundation',
            '  const lesson2State = groupSelectionState(lesson2Keys);\n  const newTestamentState = groupSelectionState(newTestamentFrequencyKeys);\n  const selectedNewTestamentCount = decks?.newTestamentVocabulary.cards.filter((card) => exactCardSelected(decks.newTestamentVocabulary, card)).length ?? 0;\n  const countFoundation')

          nt_markup = '''\n      <FilterDisclosure title="New Testament Vocab" summary={`${selectedNewTestamentCount} of ${decks.newTestamentVocabulary.cards.length} words selected`} count={decks.newTestamentVocabulary.cards.length} checked={newTestamentState.checked} mixed={newTestamentState.mixed} onCheckedChange={(checked) => changeGroups(newTestamentFrequencyKeys, checked)}>\n        {NEW_TESTAMENT_FREQUENCY_GROUPS.map((group) => {\n          const groupCards = decks.newTestamentVocabulary.cards.filter((card) => card.metadata?.frequencyGroupKey === group.key);\n          const groupState = groupSelectionState([group.key]);\n          const selectedCount = groupCards.filter((card) => exactCardSelected(decks.newTestamentVocabulary, card)).length;\n          return <FilterDisclosure key={group.key} title={group.label} summary={`${selectedCount} of ${groupCards.length} words selected`} count={groupCards.length} nested checked={groupState.checked} mixed={groupState.mixed} onCheckedChange={(checked) => changeGroups([group.key], checked)}>\n            <ExactCardSelection cards={groupCards} isSelected={(card) => exactCardSelected(decks.newTestamentVocabulary, card)} onCardChange={(card, checked) => changeExactCard(decks.newTestamentVocabulary, card, checked)} sectionTitle={null} />\n          </FilterDisclosure>;\n        })}\n      </FilterDisclosure>\n'''
          replace_once('src/pages/greek-page-v2.tsx',
            '      </FilterSection>\n\n      <FilterDisclosure title="Lesson 1"',
            '      </FilterSection>\n' + nt_markup + '\n      <FilterDisclosure title="Lesson 1"')
          replace_once('src/pages/greek-page-v2.tsx',
            '''          <FilterDisclosure title="Vocabulary" summary={`${selectedVocabularyCount} of ${vocabularyDeck.cards.length} words selected`} count={vocabularyDeck.cards.length} nested checked={vocabularySelection.checked} mixed={vocabularySelection.mixed} onCheckedChange={(checked) => changeGroups([config.vocabularyKey], checked)}>\n            <FilterDisclosure title="Vocabulary words" summary={`${selectedVocabularyCount} of ${vocabularyDeck.cards.length} selected`} count={vocabularyDeck.cards.length} nested checked={selectedVocabularyCount === vocabularyDeck.cards.length} mixed={selectedVocabularyCount > 0 && selectedVocabularyCount < vocabularyDeck.cards.length} onCheckedChange={(checked) => changeExactVocabularyDeck(vocabularyDeck, checked)}>\n              <ExactCardSelection cards={vocabularyDeck.cards} isSelected={(card) => exactCardSelected(vocabularyDeck, card)} onCardChange={(card, checked) => changeExactCard(vocabularyDeck, card, checked)} sectionTitle={`Lesson ${config.lesson} words`} />\n            </FilterDisclosure>\n          </FilterDisclosure>''',
            '''          <FilterDisclosure title="Vocabulary" summary={`${selectedVocabularyCount} of ${vocabularyDeck.cards.length} words selected`} count={vocabularyDeck.cards.length} nested checked={vocabularySelection.checked} mixed={vocabularySelection.mixed} onCheckedChange={(checked) => changeGroups([config.vocabularyKey], checked)}>\n            <ExactCardSelection cards={vocabularyDeck.cards} isSelected={(card) => exactCardSelected(vocabularyDeck, card)} onCardChange={(card, checked) => changeExactCard(vocabularyDeck, card, checked)} sectionTitle={null} />\n          </FilterDisclosure>''')

          # Exact-card component: allow word lists directly beneath their parent disclosure, without a redundant heading layer.
          replace_once('src/features/study/study-filter-menu.tsx',
            '  sectionTitle?: string;\n};',
            '  sectionTitle?: string | null;\n};')
          replace_once('src/features/study/study-filter-menu.tsx',
            'export function ExactCardSelection({ cards, isSelected, onCardChange, onCardsChange, chunkSize, labelForCard = defaultCardLabel, sectionTitle = "Cards" }: ExactCardSelectionProps) {\n  const renderCards = (items: readonly StudyCard[], offset = 0) => <FilterSection title={sectionTitle}>\n    {items.map((card, index) => <FilterCheckbox key={`${card.deckId}:${card.id}`} label={labelForCard(card, offset + index)} checked={isSelected(card)} onChange={(checked) => onCardChange(card, checked)} />)}\n  </FilterSection>;',
            'export function ExactCardSelection({ cards, isSelected, onCardChange, onCardsChange, chunkSize, labelForCard = defaultCardLabel, sectionTitle = "Cards" }: ExactCardSelectionProps) {\n  const renderCards = (items: readonly StudyCard[], offset = 0) => {\n    const options = items.map((card, index) => <FilterCheckbox key={`${card.deckId}:${card.id}`} label={labelForCard(card, offset + index)} checked={isSelected(card)} onChange={(checked) => onCardChange(card, checked)} />);\n    return sectionTitle === null ? <div className="filter-option-grid">{options}</div> : <FilterSection title={sectionTitle}>{options}</FilterSection>;\n  };')

          # Greek filter persistence: permit newly introduced optional groups without selecting them by default.
          replace_once('src/features/study/filter-preferences.ts',
            'export function loadGreekFilterSelection(defaultKeys: readonly string[], storage?: StorageLike | null) {',
            'export function loadGreekFilterSelection(defaultKeys: readonly string[], storage?: StorageLike | null, allowedKeys: readonly string[] = defaultKeys) {')
          replace_once('src/features/study/filter-preferences.ts',
            '    const allowed = new Set(defaultKeys);\n    return new Set(stringArray(JSON.parse(raw)).filter((key) => allowed.has(key)));',
            '    const allowed = new Set(allowedKeys);\n    return new Set(stringArray(JSON.parse(raw)).filter((key) => allowed.has(key)));')

          # Register the deck everywhere Stats/session coverage expects built-ins.
          replace_once('src/features/study/builtin-study-catalog.ts',
            '} from "../../data/greek-lessons-9-10";\n',
            '} from "../../data/greek-lessons-9-10";\nimport { loadGreekNewTestamentVocabularyDeck } from "../../data/greek-new-testament-vocab";\n')
          replace_once('src/features/study/builtin-study-catalog.ts',
            '  { id: "alpha-omega-lesson10-grammar", language: "Greek", source: "Lesson 10 Grammar", load: loadGreekLesson10GrammarDeck, modes: [{ mode: "Forward", direction: "forward", studyKey: "forward" }] },\n  { id: "dickinson-latin-core"',
            '  { id: "alpha-omega-lesson10-grammar", language: "Greek", source: "Lesson 10 Grammar", load: loadGreekLesson10GrammarDeck, modes: [{ mode: "Forward", direction: "forward", studyKey: "forward" }] },\n  { id: "kubo-new-testament-vocab", language: "Greek", source: "New Testament Vocab", load: loadGreekNewTestamentVocabularyDeck, modes: [{ mode: "Forward", direction: "forward", studyKey: "forward" }, { mode: "Reverse", direction: "reverse", studyKey: "reverse" }] },\n  { id: "dickinson-latin-core"')

          # On-demand audio support for the new cards; the existing prewarm workflow is deliberately unchanged.
          replace_once('supabase/functions/course-audio/builtin-greek-assets.ts',
            'import { lesson10CourseAudioAssets, lesson10VocabularyAudio } from "./lesson10-assets.ts";\n',
            'import { lesson10CourseAudioAssets, lesson10VocabularyAudio } from "./lesson10-assets.ts";\nimport { newTestamentVocabularyAudio } from "./new-testament-vocabulary-assets.ts";\n')
          replace_once('supabase/functions/course-audio/builtin-greek-assets.ts',
            'lesson9VocabularyAudio[assetId] ?? lesson10VocabularyAudio[assetId];',
            'lesson9VocabularyAudio[assetId] ?? lesson10VocabularyAudio[assetId] ?? newTestamentVocabularyAudio[assetId];')

          # Make the Z shortcut visible next to the timer without crowding the study controls.
          replace_once('src/features/study/multi-source-study-session.tsx',
            '              <span className="toolbar-timer-value">{displayedTimer}</span>\n              <button type="button" className="toolbar-timer-toggle"',
            '              <span className="toolbar-timer-value">{displayedTimer}</span>\n              <span className="toolbar-timer-shortcut" aria-hidden="true"><kbd>Z</kbd> Pause</span>\n              <button type="button" className="toolbar-timer-toggle"')

          gate = root / 'src/features/study/study-gate.css'
          gate.write_text(gate.read_text(encoding='utf-8') + '''\n\n/* Keep the pause shortcut visible beside the live timer. A modest desktop-only\n   width increase gives the toolbar room without stretching mobile cards. */\n@media (min-width: 1100px) {\n  .study-page { width: min(1240px, 100%); }\n}\n\n.toolbar-timer {\n  min-height: 40px;\n  padding: 0.3rem 0.35rem 0.3rem 0.72rem;\n  display: inline-flex;\n  gap: 0.45rem;\n  align-items: center;\n  border: 1px solid var(--border);\n  border-radius: 999px;\n  color: var(--foreground);\n  background: var(--panel-2);\n  font-variant-numeric: tabular-nums;\n  font-weight: 750;\n  white-space: nowrap;\n}\n.toolbar-timer-shortcut { display: inline-flex; gap: 0.28rem; align-items: center; color: var(--ink-soft); font-size: 0.72rem; font-weight: 700; }\n.toolbar-timer-toggle { width: 1.9rem; height: 1.9rem; padding: 0; display: grid; place-items: center; border: 0; border-radius: 50%; color: var(--burgundy); background: var(--panel); }\n.toolbar-timer-toggle svg { width: 0.92rem; height: 0.92rem; }\n@media (max-width: 480px) { .toolbar-timer { width: 100%; justify-content: center; } }\n''', encoding='utf-8')

          # Learner-facing guide: document the new selector and the direct lesson word layout.
          replace_once('src/components/how-site-works.tsx',
            'Greek Lessons 3–10 are organized around <strong>Vocabulary</strong> and <strong>Endings</strong>; the Vocabulary heading itself is the all-vocabulary control for that lesson, and its <strong>Vocabulary words</strong> dropdown exposes every word individually without a redundant second “All Lesson … vocabulary” row.',
            'Greek Lessons 3–10 are organized around <strong>Vocabulary</strong> and <strong>Endings</strong>. The Vocabulary heading itself is the all-vocabulary control for that lesson; opening it shows the individual words immediately, with no extra “Vocabulary words” layer and no redundant “All Lesson … vocabulary” row. A separate <strong>New Testament Vocab</strong> parent contains Kubo’s general high-frequency New Testament list, sorted by frequency rank and divided into 1,000+, 500–999, 250–499, 150–249, 100–149, 75–99, 60–74, and 50–59 occurrence groups. Each New Testament card shows its occurrence count and frequency rank on the answer side. The separate John special-vocabulary lists are not added unless a word also occurs in the general list.')
          replace_once('src/components/how-site-works.tsx',
            'While question-side timing is running, <strong>Z</strong> stops the timer and reopens the Start gate.',
            'While question-side timing is running, <strong>Z</strong> stops the timer and reopens the Start gate. The timer itself displays a <strong>Z · Pause</strong> cue so the shortcut is visible during study.')

          # Permanent repository instructions: preserve this structure in future edits.
          replace_once('AGENTS.md',
            'Current Greek vocabulary sources are Lessons 3–10 Vocabulary. Lessons 3–10 expose Vocabulary and Endings in the active menu; paradigm source cards are not exposed there. Each lesson Vocabulary heading is already its all-vocabulary selector, and Vocabulary words exposes exact cards, so do not add a redundant “All Lesson N vocabulary” row.',
            'Current Greek vocabulary sources are Lessons 3–10 Vocabulary plus the separate New Testament Vocab source. Lessons 3–10 expose Vocabulary and Endings in the active menu; paradigm source cards are not exposed there. Each lesson Vocabulary heading is already its all-vocabulary selector, and opening it exposes the exact word cards immediately; do not add a nested “Vocabulary words” layer or a redundant “All Lesson N vocabulary” row. New Testament Vocab is the Kubo Appendix I general list only, frequency-ranked and grouped into 1,000+, 500–999, 250–499, 150–249, 100–149, 75–99, 60–74, and 50–59 parent groups. Do not import John-only special-vocabulary entries unless they also occur in the general list.')
          replace_once('AGENTS.md',
            '- Z stops active question-side timing and reopens the Start gate.',
            '- Z stops active question-side timing and reopens the Start gate. Keep the visible `Z · Pause` cue beside the toolbar timer so learners can discover the shortcut.')

          # Maintenance notes and Copilot instructions get short durable invariants.
          maint = root / 'docs/MAINTENANCE.md'
          maint.write_text(maint.read_text(encoding='utf-8') + '''\n\n### New Testament Greek vocabulary\n\n- `kubo-new-testament-vocab` is a separate built-in Greek deck backed by `public/data/greek-new-testament-vocab.json`. Preserve its stable card IDs, frequency values/ranks, Forward/Reverse histories, exact-card selection, Saved Cards, Deselect behavior, Stats/session registration, and pronunciation metadata.\n- The active selector exposes Kubo's general Appendix I list only. John-only special-vocabulary entries do not belong in this deck unless they also occur in the general list. Frequency parents are 1,000+, 500–999, 250–499, 150–249, 100–149, 75–99, 60–74, and 50–59 occurrences.\n- Lesson 3–10 Vocabulary disclosures show their exact words immediately; do not add a redundant `Vocabulary words` disclosure.\n- The study timer keeps a visible `Z · Pause` cue; Z and any page click pause active question-side timing and reopen the Start gate.\n''', encoding='utf-8')
          copilot = root / '.github/copilot-instructions.md'
          copilot.write_text(copilot.read_text(encoding='utf-8') + '''\n\n- Greek includes a separate registered `kubo-new-testament-vocab` deck sourced from Kubo Appendix I's general high-frequency list. It is frequency-ranked, grouped by occurrence bands, and excludes John-only special-vocabulary entries. Preserve exact-card selection, Forward/Reverse histories, frequency display, pronunciation, audio-on-demand, Stats/session coverage, and stable IDs.\n- Greek Lessons 3–10 show exact words directly inside each Vocabulary disclosure; do not add a redundant `Vocabulary words` sub-disclosure. Keep the visible `Z · Pause` cue beside the study timer.\n''', encoding='utf-8')

          # Regression tests for source count/order/groups, answer metadata, and John-list exclusion.
          test = r'''import { describe, expect, it } from "vitest";
          import { loadGreekNewTestamentVocabularyDeck, NEW_TESTAMENT_FREQUENCY_GROUPS } from "../src/data/greek-new-testament-vocab";
          import fs from "node:fs/promises";
          import path from "node:path";

          describe("Kubo New Testament vocabulary", () => {
            it("contains exactly the 301 general-list cards sorted by descending frequency rank", async () => {
              const source = JSON.parse(await fs.readFile(path.join(process.cwd(), "public/data/greek-new-testament-vocab.json"), "utf8")) as Array<{ greek: string; frequency: number; frequency_rank: number; group: string }>;
              expect(source).toHaveLength(301);
              expect(source.map((card) => card.frequency_rank)).toEqual(Array.from({ length: 301 }, (_, index) => index + 1));
              expect(source.map((card) => card.frequency)).toEqual([...source.map((card) => card.frequency)].sort((a, b) => b - a));
              expect(source[0]).toMatchObject({ greek: "ὁ, ἡ, τό", frequency: 19734, frequency_rank: 1, group: "1000-plus" });
              expect(source.find((card) => card.greek === "ἐσθίω")?.frequency).toBe(65);
              expect(source.find((card) => card.greek === "φάγω")?.frequency).toBe(94);
              expect(source.some((card) => card.greek.toLowerCase().includes("χριστ"))).toBe(false);
            });

            it("uses the eight requested natural frequency parents and keeps all cards covered exactly once", async () => {
              const source = JSON.parse(await fs.readFile(path.join(process.cwd(), "public/data/greek-new-testament-vocab.json"), "utf8")) as Array<{ group: string }>;
              expect(NEW_TESTAMENT_FREQUENCY_GROUPS.map((group) => group.dataGroup)).toEqual(["1000-plus", "500-999", "250-499", "150-249", "100-149", "75-99", "60-74", "50-59"]);
              const counts = Object.fromEntries(NEW_TESTAMENT_FREQUENCY_GROUPS.map((group) => [group.dataGroup, source.filter((card) => card.group === group.dataGroup).length]));
              expect(counts).toEqual({ "1000-plus": 19, "500-999": 19, "250-499": 23, "150-249": 44, "100-149": 60, "75-99": 57, "60-74": 42, "50-59": 37 });
            });

            it("does not import John-only special-vocabulary entries", async () => {
              const source = JSON.parse(await fs.readFile(path.join(process.cwd(), "public/data/greek-new-testament-vocab.json"), "utf8")) as Array<{ greek: string }>;
              const text = source.map((card) => card.greek).join(" ");
              for (const johnOnly of ["ἀδελφή", "νίπτω", "πάσχα", "πρόβατον", "ῥαββί", "σκοτία", "σταυρόω", "φίλος"]) expect(text).not.toContain(johnOnly);
            });
          });
          '''
          (root / 'tests/greek-new-testament-vocab.test.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n', encoding='utf-8')

          # Static UI regression: no extra Vocabulary words disclosure and visible Z pause cue.
          ui_test = r'''import { describe, expect, it } from "vitest";
          import fs from "node:fs";
          import path from "node:path";

          describe("Greek vocabulary selector structure", () => {
            it("shows lesson words directly and exposes New Testament Vocab frequency parents", () => {
              const page = fs.readFileSync(path.join(process.cwd(), "src/pages/greek-page-v2.tsx"), "utf8");
              expect(page).not.toContain('title="Vocabulary words"');
              expect(page).toContain('title="New Testament Vocab"');
              expect(page).toContain("NEW_TESTAMENT_FREQUENCY_GROUPS.map");
              expect(page).toContain("sectionTitle={null}");
            });
            it("keeps the timer shortcut discoverable", () => {
              const session = fs.readFileSync(path.join(process.cwd(), "src/features/study/multi-source-study-session.tsx"), "utf8");
              expect(session).toContain('<kbd>Z</kbd> Pause');
            });
          });
          '''
          (root / 'tests/greek-selector-structure.test.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in ui_test.splitlines()) + '\n', encoding='utf-8')
